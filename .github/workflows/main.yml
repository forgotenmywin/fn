                const normal=[-dz,0,dx]; const nl=Math.hypot(normal[0],normal[2])||1;
                addQuad(to3(a,bottom),to3(b,bottom),to3(b,top),to3(a,top),mat,[normal[0]/nl,0,normal[2]/nl]);
              }
