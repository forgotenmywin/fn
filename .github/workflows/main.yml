            const baseFor = node => buildingPos[1] + Number(levelFor(node).baseElevation || 0);
            const walls = nodeTypes.filter(node => node.type === 'wall');
            const wallById = new Map(walls.map(wall => [wall.id, wall]));
            const openingsFor = wall => {
              const ids = new Set([...(wall.children || [])]);
              return nodeTypes.filter(node => (node.type === 'door' || node.type === 'window') && (node.parentId === wall.id || node.wallId === wall.id || ids.has(node.id)));
            };
            const wallMaterial = materialFor('plaster');
            for (const wall of walls) {
              if (!Array.isArray(wall.start) || !Array.isArray(wall.end)) { unsupported.add('wall-without-start-end'); continue; }
              const sx=wall.start[0]+buildingPos[0], sz=wall.start[1]+buildingPos[2];
              const dx=wall.end[0]-wall.start[0], dz=wall.end[1]-wall.start[1];
              const len=Math.hypot(dx,dz); if (len < 0.001) continue;
              const dir=[dx/len,dz/len];
              const thickness=Number(wall.thickness || 0.2);
              const height=Number(wall.height || levelFor(wall).height || 2.5);
              const base=baseFor(wall);
              const yaw=Math.atan2(-dir[1],dir[0]);
              const openings=openingsFor(wall).map(opening => {
                const pos=Array.isArray(opening.position)?opening.position:[len/2,opening.height/2,0];
                const width=Number(opening.width||0.9), h=Number(opening.height||2.0);
                return { node:opening, x0:Math.max(0,Number(pos[0]||0)-width/2), x1:Math.min(len,Number(pos[0]||0)+width/2), y0:Math.max(0,Number(pos[1]||h/2)-h/2), y1:Math.min(height,Number(pos[1]||h/2)+h/2), width, h, x:Number(pos[0]||0), y:Number(pos[1]||h/2) };
              }).filter(opening=>opening.x1>opening.x0 && opening.y1>opening.y0);
              const xs=[0,len,...openings.flatMap(o=>[o.x0,o.x1])].sort((a,b)=>a-b).filter((v,i,a)=>i===0||Math.abs(v-a[i-1])>1e-5);
              const ys=[0,height,...openings.flatMap(o=>[o.y0,o.y1])].sort((a,b)=>a-b).filter((v,i,a)=>i===0||Math.abs(v-a[i-1])>1e-5);
              for(let xi=0;xi<xs.length-1;xi++) for(let yi=0;yi<ys.length-1;yi++) {
                const x0=xs[xi],x1=xs[xi+1],y0=ys[yi],y1=ys[yi+1];
                if(x1-x0<1e-4||y1-y0<1e-4) continue;
                const mx=(x0+x1)/2,my=(y0+y1)/2;
                if(openings.some(o=>mx>o.x0-1e-5&&mx<o.x1+1e-5&&my>o.y0-1e-5&&my<o.y1+1e-5)) continue;
                const along=(x0+x1)/2;
                const center=[sx+dir[0]*along,base+(y0+y1)/2,sz+dir[1]*along];
                addBox(center,[x1-x0,y1-y0,thickness],wallMaterial,yaw);
              }
              for(const o of openings) {
                const frame=materialFor('frame');
                const frameW=Math.min(0.06,Math.max(0.025,Number(o.node.frameThickness||0.045)));
                const depth=thickness+0.07;
                const centerAt=(along, y, depthOffset=0)=>[sx+dir[0]*along+(-dir[1])*depthOffset,base+y,sz+dir[1]*along+dir[0]*depthOffset];
                const jambY=(o.y0+o.y1)/2, jambH=o.y1-o.y0;
                addBox(centerAt(o.x0+frameW/2,jambY),[frameW,jambH,depth],frame,yaw);
                addBox(centerAt(o.x1-frameW/2,jambY),[frameW,jambH,depth],frame,yaw);
                addBox(centerAt(o.x,(o.y1-frameW/2)),[o.x1-o.x0,frameW,depth],frame,yaw);
                if(o.node.type==='window') {
                  addBox(centerAt(o.x,o.y0+frameW/2),[o.x1-o.x0,frameW,depth],frame,yaw);
                  const glass=materialFor('glass');
                  addBox(centerAt(o.x,jambY,0.008),[Math.max(0.02,o.x1-o.x0-2*frameW),Math.max(0.02,jambH-2*frameW),0.025],glass,yaw);
                } else {
                  const door=materialFor('wood',hexColor(o.node.color,MATERIALS.wood.color));
                  addBox(centerAt(o.x,jambY,0.012),[Math.max(0.02,o.x1-o.x0-2*frameW),Math.max(0.02,jambH-frameW),0.045],door,yaw);
                }
              }
            }

            for (const node of nodeTypes) {
              const base=baseFor(node);
              if (node.type==='slab') {
                const poly=(node.polygon||[]).map(p=>[Number(p[0])+buildingPos[0],Number(p[1])+buildingPos[2]]);
                if(poly.length>=3) addPrism(poly,base+Number(node.elevation||0)-Number(node.thickness||0.05),base+Number(node.elevation||0),materialFor('floor'));
              } else if (node.type==='ceiling' || node.type==='roof') {
                const poly=(node.polygon||[]).map(p=>[Number(p[0])+buildingPos[0],Number(p[1])+buildingPos[2]]);
                if(poly.length>=3) {
                  const level=levelFor(node);
                  const y=base+Number(node.elevation ?? level.height ?? 2.5);
                  addPrism(poly,y-0.045,y,materialFor(node.type==='roof'?'roof':'ceiling'));
                } else unsupported.add(node.type+'-without-polygon');
              } else if (node.type==='column') {
                const p=node.position||[0,0];
                const w=Number(node.width||0.3),d=Number(node.depth||w),h=Number(node.height||2.5);
                addBox([p[0]+buildingPos[0],base+h/2,p[1]+buildingPos[2]],[w,h,d],materialFor('generic'));
              } else if (node.type==='item' && Array.isArray(node.position)) {
                const dims=node.dimensions||node.size||[node.width||0.5,node.height||0.8,node.depth||0.5];
                if(Array.isArray(dims)&&dims.length>=3) addBox([node.position[0]+buildingPos[0],base+node.position[1]+Number(dims[1])/2,node.position[2]+buildingPos[2]],[Number(dims[0]),Number(dims[1]),Number(dims[2])],materialFor('generic'));
                else unsupported.add('item-without-dimensions');
              } else if (!['site','building','level','wall','zone','door','window','slab','ceiling','roof','column','item'].includes(node.type)) {
                unsupported.add(String(node.type||'unknown'));
              }
            }

            const meshGroups=[...groups.values()].filter(group=>group.positions.length>=9);
            if(!meshGroups.length) throw new Error('No exportable 3D geometry was found in the Pascal SceneGraph.');
            const chunks=[]; const bufferViews=[]; const accessors=[]; const materials=[]; const primitives=[]; let byteOffset=0;
            const appendBytes=(typed)=>{
              const raw=Buffer.from(typed.buffer,typed.byteOffset,typed.byteLength);
              const pad=(4-(byteOffset%4))%4;
              if(pad){chunks.push(Buffer.alloc(pad));byteOffset+=pad;}
              const offset=byteOffset; chunks.push(raw); byteOffset+=raw.length; return {byteOffset:offset,byteLength:raw.length};
            };
            const allPositions=[];
            for(const group of meshGroups){
              const positions=Float32Array.from(group.positions), normals=Float32Array.from(group.normals);
              const posRange=appendBytes(positions); const normRange=appendBytes(normals);
              const posView=bufferViews.push({buffer:0,...posRange,target:34962})-1;
              const normView=bufferViews.push({buffer:0,...normRange,target:34962})-1;
              const mins=[Infinity,Infinity,Infinity],maxs=[-Infinity,-Infinity,-Infinity];
              for(let i=0;i<positions.length;i+=3){for(let a=0;a<3;a++){mins[a]=Math.min(mins[a],positions[i+a]);maxs[a]=Math.max(maxs[a],positions[i+a]);allPositions.push(positions[i+a]);}}
              const posAccessor=accessors.push({bufferView:posView,componentType:5126,count:positions.length/3,type:'VEC3',min:mins,max:maxs})-1;
              const normAccessor=accessors.push({bufferView:normView,componentType:5126,count:normals.length/3,type:'VEC3'})-1;
              const color=group.color.match(/[0-9a-f]{2}/gi).map(hex=>parseInt(hex,16)/255);
              const matIndex=materials.push({name:group.name,pbrMetallicRoughness:{baseColorFactor:[...color,group.opacity],metallicFactor:0,roughnessFactor:group.roughness},alphaMode:group.opacity<1?'BLEND':'OPAQUE',doubleSided:group.doubleSided})-1;
              primitives.push({attributes:{POSITION:posAccessor,NORMAL:normAccessor},material:matIndex,mode:4});
            }
            const binary=Buffer.concat(chunks); const binaryPad=(4-(binary.length%4))%4;
            const binChunk=binaryPad?Buffer.concat([binary,Buffer.alloc(binaryPad)]):binary;
            const gltf={asset:{version:'2.0',generator:'Pascal Snapshot Exporter'},scene:0,scenes:[{nodes:[0]}],nodes:[{name:'Pascal 3D Export',mesh:0}],meshes:[{name:'Pascal Building',primitives}],materials,accessors,bufferViews,buffers:[{byteLength:binary.length}]};
            const json=Buffer.from(JSON.stringify(gltf)); const jsonPad=(4-(json.length%4))%4;
            const jsonChunk=jsonPad?Buffer.concat([json,Buffer.alloc(jsonPad,0x20)]):json;
            const total=12+8+jsonChunk.length+8+binChunk.length;
            const header=Buffer.alloc(12);header.writeUInt32LE(0x46546c67,0);header.writeUInt32LE(2,4);header.writeUInt32LE(total,8);
            const jsonHeader=Buffer.alloc(8);jsonHeader.writeUInt32LE(jsonChunk.length,0);jsonHeader.writeUInt32LE(0x4e4f534a,4);
            const binHeader=Buffer.alloc(8);binHeader.writeUInt32LE(binChunk.length,0);binHeader.writeUInt32LE(0x004e4942,4);
            const glb=Buffer.concat([header,jsonHeader,jsonChunk,binHeader,binChunk]);
            const nodeTypeCounts=nodeTypes.reduce((acc,node)=>{acc[node.type]=(acc[node.type]||0)+1;return acc;},{});
            return {glb,report:{nodeCount:nodeTypes.length,meshCount:meshGroups.length,triangleCount:meshGroups.reduce((sum,g)=>sum+g.positions.length/9,0),materialCount:materials.length,nodeTypeCounts,unsupportedNodeTypes:[...unsupported]}};
          }

          async function exportSnapshot(args={}) {
            if(args.sceneId && args.sceneId!==sceneId) await tool('load_scene',{id:args.sceneId});
            const graph=await refreshGraph(args.sceneId||null);
            if(!hasBuildingGeometry(graph)) throw new Error('SceneGraph has no exportable architectural geometry.');
            const {glb,report}=makeGlb(graph);
            await fs.mkdir(EXPORT_DIR,{recursive:true});
            const stamp=new Date().toISOString().replace(/[:.]/g,'-');
            const requested=fileSafeName(args.filename||sceneName.replace(/[^\p{L}\p{N}._ -]+/gu,'_').replace(/\s+/g,'_')); 
            const fileName=requested.replace(/\.glb$/i,'')+'_'+stamp+'.glb';
            const versionDir=path.join(EXPORT_DIR,'versions');
            await fs.mkdir(versionDir,{recursive:true});
            const versionPath=path.join(versionDir,fileName);
            const latestPath=path.join(EXPORT_DIR,'latest.glb');
            const tempPath=path.join(EXPORT_DIR,`.latest-${crypto.randomUUID()}.tmp`);
            await fs.writeFile(versionPath,glb);
            await fs.writeFile(tempPath,glb);
            await fs.rename(tempPath,latestPath);
            const exportId=crypto.randomUUID();
            const manifest={
              exportId,fileName,latestFile:'latest.glb',createdAt:new Date().toISOString(),
              projectName,sceneName,sceneId,projectId,source:graphSource,nodeCount:report.nodeCount,
              sizeBytes:glb.length,sizeLabel:glb.length<1048576?`${(glb.length/1024).toFixed(1)} KB`:`${(glb.length/1048576).toFixed(2)} MB`,
              triangleCount:report.triangleCount,meshCount:report.meshCount,materialCount:report.materialCount,
              nodeTypeCounts:report.nodeTypeCounts,unsupportedNodeTypes:report.unsupportedNodeTypes,
              graphHash:latestGraphHash,downloadUrl:'/exports/latest.glb',versionUrl:`/exports/versions/${encodeURIComponent(fileName)}`,
            };
            await fs.writeFile(path.join(EXPORT_DIR,'latest.json'),JSON.stringify(manifest,null,2));
            latestExport=manifest;
            broadcastExport('exported',manifest);
            console.log(`PASCAL_3D_EXPORT=PASS file=${fileName} bytes=${glb.length} triangles=${report.triangleCount} nodes=${report.nodeCount}`);
            return manifest;
          }

          function broadcastExport(eventName,payload){
            for(const response of exportClients){try{response.write(`event: ${eventName}\ndata: ${JSON.stringify(payload)}\n\n`);}catch{exportClients.delete(response);}}
          }

          async function readJson(req,limit=1024*1024){
            const chunks=[];let size=0;
            for await(const chunk of req){size+=chunk.length;if(size>limit)throw new Error('Request body too large.');chunks.push(chunk);}
            if(!chunks.length)return {};
            return JSON.parse(Buffer.concat(chunks).toString('utf8'));
          }

          const mime={
            '.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.css':'text/css; charset=utf-8',
            '.svg':'image/svg+xml','.json':'application/json; charset=utf-8','.png':'image/png','.woff2':'font/woff2','.glb':'model/gltf-binary',
          };

          async function sendFile(res,pathname){
            const relative=decodeURIComponent(pathname.replace(/^\/+/,''));
            if(relative.includes('..')){res.writeHead(400);res.end('Invalid path');return;}
            const root=relative.startsWith('exports/')?EXPORT_DIR:path.join(APP_DIR,'dist');
            const local=relative.startsWith('exports/')?relative.slice('exports/'.length):relative||'index.html';
            const full=path.resolve(root,local);
            if(!full.startsWith(path.resolve(root)+path.sep)&&full!==path.resolve(root,'index.html')){res.writeHead(400);res.end('Invalid path');return;}
            try{
              const stat=await fs.stat(full);
              if(!stat.isFile())throw new Error('Not a file');
              res.writeHead(200,{'content-type':mime[path.extname(full)]||'application/octet-stream','content-length':stat.size,'cache-control':relative.startsWith('exports/')?'no-store':'public, max-age=3600'});
              createReadStream(full).pipe(res);
            }catch{
              if(relative.startsWith('assets/')||/\.(js|mjs|css|map|woff2?)$/i.test(relative)){res.writeHead(404,{'content-type':'text/plain; charset=utf-8'});res.end(`File not found: ${relative}`);return;}
              try{const body=await fs.readFile(path.join(APP_DIR,'dist','index.html'));res.writeHead(200,{'content-type':'text/html; charset=utf-8','cache-control':'no-store'});res.end(body);}
              catch{res.writeHead(500);res.end('Viewer frontend unavailable');}
            }
          }

          const server=http.createServer(async(req,res)=>{
            try{
              const url=new URL(req.url||'/','http://127.0.0.1');
              if(req.method==='GET'&&url.pathname==='/api/health'){
                res.writeHead(200,{'content-type':'application/json; charset=utf-8','cache-control':'no-store'});
                res.end(JSON.stringify({ok:true,viewer:'pascal-3d-snapshot',mode:'explicit-export-only',hasExport:!!latestExport,latestExport,sceneId}));return;
              }
              if(req.method==='GET'&&url.pathname==='/api/export-status'){
                if(!latestExport){try{latestExport=JSON.parse(await fs.readFile(path.join(EXPORT_DIR,'latest.json'),'utf8'));}catch{}}
                res.writeHead(200,{'content-type':'application/json; charset=utf-8','cache-control':'no-store'});
                res.end(JSON.stringify({export:latestExport,error:lastError}));return;
              }
              if(req.method==='GET'&&url.pathname==='/api/export-events'){
                res.writeHead(200,{'content-type':'text/event-stream; charset=utf-8','cache-control':'no-cache, no-transform','connection':'keep-alive','x-accel-buffering':'no'});
                res.write(': connected\n\n');exportClients.add(res);
                if(latestExport)res.write(`event: exported\ndata: ${JSON.stringify(latestExport)}\n\n`);
                req.on('close',()=>exportClients.delete(res));return;
              }
              if(req.method==='POST'&&url.pathname==='/api/export'){
                const args=await readJson(req);
                const result=await queueMcp(()=>exportSnapshot(args));
                res.writeHead(200,{'content-type':'application/json; charset=utf-8','cache-control':'no-store'});
                res.end(JSON.stringify({...result,viewerUrl:process.env.PASCAL_VIEWER_PUBLIC_URL||'/',downloadUrl:'/exports/latest.glb'}));return;
              }
              if(req.method==='POST'&&url.pathname==='/api/save'){
                const result=await queueMcp(async()=>{
                  const graph=latestGraph||await refreshGraph();
                  if(!hasBuildingGeometry(graph))throw new Error('There is no valid building SceneGraph to back up.');
                  const saved=await tool('save_scene',{name:sceneName,includeCurrentScene:false,graph,saveMode:'checkpoint',...(sceneId?{id:sceneId}:{})});
                  if(saved?.id)sceneId=saved.id;
                  const workDir=await fs.mkdtemp(path.join(os.tmpdir(),'pascal-backup-'));
                  const payloadDir=path.join(workDir,'Pascal_Project_Backup');
                  await fs.mkdir(payloadDir,{recursive:true});
                  await fs.cp(DATA_DIR,path.join(payloadDir,'pascal-data'),{recursive:true,force:true});
                  await fs.writeFile(path.join(payloadDir,fileName),JSON.stringify(graph,null,2),'utf8');
                  await fs.writeFile(path.join(payloadDir,'project-manifest.json'),JSON.stringify({projectName,projectId,sceneName,sceneId,savedVersion:saved?.version??null,createdAt:new Date().toISOString(),latestExport},null,2),'utf8');
                  const archivePath=path.join(os.tmpdir(),`pascal-backup-${crypto.randomUUID()}.zip`);
                  await execFileAsync('zip',['-q','-r',archivePath,'Pascal_Project_Backup'],{cwd:workDir,maxBuffer:32*1024*1024});
                  return {workDir,archivePath};
                });
                const stat=await fs.stat(result.archivePath);
                res.writeHead(200,{'content-type':'application/zip','content-length':stat.size,'content-disposition':'attachment; filename="Pascal_Project_Backup.zip"','cache-control':'no-store'});
                const stream=createReadStream(result.archivePath);stream.on('close',()=>{fs.rm(result.workDir,{recursive:true,force:true}).catch(()=>{});fs.rm(result.archivePath,{force:true}).catch(()=>{});});stream.pipe(res);return;
              }
              if(req.method==='GET'&&url.pathname.startsWith('/exports/')){await sendFile(res,url.pathname);return;}
              if(req.method==='GET'){await sendFile(res,url.pathname);return;}
              res.writeHead(405,{'content-type':'text/plain; charset=utf-8'});res.end('Method not allowed');
            }catch(error){
              lastError=error?.message||String(error);
              console.error('PASCAL_VIEWER_REQUEST_ERROR',lastError);
              if(!res.headersSent)res.writeHead(500,{'content-type':'application/json; charset=utf-8','cache-control':'no-store'});
              res.end(JSON.stringify({ok:false,error:lastError}));
            }
          });

          await fs.mkdir(EXPORT_DIR,{recursive:true});
          seedGraph=JSON.parse(await fs.readFile(SEED_GRAPH_PATH,'utf8'));
          await initializeMcp();
          await queueMcp(initializeWorkspace);
          try{latestExport=JSON.parse(await fs.readFile(path.join(EXPORT_DIR,'latest.json'),'utf8'));}catch{}
          server.listen(8090,'127.0.0.1',()=>{
            console.log('Pascal 3D snapshot server listening on 127.0.0.1:8090');
            console.log(`PROJECT_NAME=${projectName}`);
            console.log(`SCENE_ID=${sceneId||'none'}`);
            console.log('PASCAL_VIEWER_MODE=EXPLICIT_GLB_EXPORT_ONLY');
          });
          SERVER

          APP_DIR="$APP_DIR" \
          MCP_LOCAL_BASE="http://127.0.0.1:8787" \
          MCP_PATH="$MCP_PATH" \
          PASCAL_PROJECT_NAME="$PROJECT_NAME" \
          PASCAL_SCENE_FILE_NAME="$SCENE_FILE_NAME" \
          PASCAL_DATA_DIR="$DATA_DIR" \
          nohup node "$RUNNER_TEMP/pascal-viewer-server.mjs" \
            > "$RUNNER_TEMP/pascal-viewer-server.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/pascal-viewer-server.pid"

          echo "Waiting for Pascal 3D snapshot monitor..."
          VIEWER_READY=0
          for _ in $(seq 1 90); do
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/ 2>/dev/null || true)"
            if [[ "$CODE" == "200" ]]; then VIEWER_READY=1; break; fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/pascal-viewer-server.pid")" 2>/dev/null; then
              echo "Snapshot server exited unexpectedly:" >&2
              cat "$RUNNER_TEMP/pascal-viewer-server.log" >&2 || true
              exit 1
            fi
            sleep 1
          done
          if [[ "$VIEWER_READY" != "1" ]]; then
            echo "Snapshot monitor did not become ready:" >&2
            cat "$RUNNER_TEMP/pascal-viewer-server.log" >&2 || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:8090/api/health -o "$RUNNER_TEMP/viewer-health.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const health = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/viewer-health.json', 'utf8'));
          if (!health.ok || health.mode !== 'explicit-export-only') throw new Error('Viewer did not start in explicit 3D export mode.');
          console.log(`PASCAL_SNAPSHOT_MONITOR=PASS mode=${health.mode}`);
          NODE

          # Verify Vite assets are present. This catches a blank frontend before publishing the tunnel.
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = process.env.RUNNER_TEMP + '/pascal-viewer-app/dist';
          const html = fs.readFileSync(path.join(root, 'index.html'), 'utf8');
          const refs = [...html.matchAll(/(?:src|href)="\/(assets\/[^\"]+)"/g)].map(match => match[1]);
          if (!refs.length) throw new Error('Vite output has no frontend asset references.');
          for (const ref of refs) if (!fs.existsSync(path.join(root, ref))) throw new Error(`Missing frontend asset: ${ref}`);
          console.log(`PASCAL_SNAPSHOT_FRONTEND_ASSETS=PASS assets=${refs.length}`);
          NODE

          # Publish the monitor first; it receives a new frozen GLB only after an explicit MCP export call.
          nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8090 \
            > "$RUNNER_TEMP/cloudflared-viewer.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/cloudflared-viewer.pid"
          VIEWER_URL="$(get_tunnel_url "$RUNNER_TEMP/cloudflared-viewer.log")"
          echo "VIEWER_URL=$VIEWER_URL" >> "$GITHUB_ENV"

          # MCP facade adds an explicit export command while forwarding all original Pascal tools.
          cat > "$RUNNER_TEMP/pascal-mcp-export-proxy.mjs" <<'PROXY'
                    import http from 'node:http';

          const UPSTREAM = process.env.MCP_UPSTREAM || 'http://127.0.0.1:8787';
          const UPSTREAM_PATH = process.env.MCP_PATH || '/mcp';
          const VIEWER = process.env.PASCAL_VIEWER_BASE || 'http://127.0.0.1:8090';
          const VIEWER_PUBLIC = process.env.PASCAL_VIEWER_PUBLIC_URL || '';
          const MAX_BODY = 4 * 1024 * 1024;
          const MCP_LEGACY = '2025-06-18';
          const MCP_MODERN = '2026-07-28';
          let modernSessionId = null;
          let modernSessionPromise = null;

          function cors(res) {
            res.setHeader('access-control-allow-origin', '*');
            res.setHeader('access-control-allow-methods', 'GET, POST, OPTIONS');
            res.setHeader('access-control-allow-headers', 'content-type, accept, mcp-protocol-version, mcp-session-id, last-event-id, mcp-method, mcp-name');
            res.setHeader('access-control-expose-headers', 'mcp-session-id, mcp-protocol-version');
          }

          async function readBody(req) {
            const chunks=[]; let size=0;
            for await (const chunk of req) { size += chunk.length; if(size>MAX_BODY) throw new Error('MCP request body too large'); chunks.push(chunk); }
            if(!chunks.length) return null;
            return JSON.parse(Buffer.concat(chunks).toString('utf8'));
          }

          function parseMcpResponse(raw) {
            const lines=raw.split(/\r?\n/).filter(line=>line.startsWith('data:'));
            if(lines.length) return JSON.parse(lines.map(line=>line.slice(5).trimStart()).join('\n'));
            if(!raw.trim()) return null;
            return JSON.parse(raw.trim());
          }

          function headerMatches(value, expected) {
            if(!value) return false;
            const raw=String(value);
            const candidates=[raw];
            try { candidates.push(decodeURIComponent(raw)); } catch {}
            try { candidates.push(Buffer.from(raw,'base64url').toString('utf8')); } catch {}
            if(raw.startsWith('base64:')) { try { candidates.push(Buffer.from(raw.slice(7),'base64').toString('utf8')); } catch {} }
            return candidates.includes(expected);
          }

          async function ensureModernSession() {
            if(modernSessionId) return modernSessionId;
            if(modernSessionPromise) return modernSessionPromise;
            modernSessionPromise=(async()=>{
              const response=await fetch(`${UPSTREAM}${UPSTREAM_PATH}`,{
                method:'POST',
                headers:{'content-type':'application/json','accept':'application/json, text/event-stream'},
                body:JSON.stringify({jsonrpc:'2.0',id:87001,method:'initialize',params:{protocolVersion:MCP_LEGACY,capabilities:{},clientInfo:{name:'pascal-modern-proxy',version:'1.0.0'}}}),
                signal:AbortSignal.timeout(30000),
              });
              const raw=await response.text();const payload=parseMcpResponse(raw);
              if(!response.ok||payload?.error)throw new Error(`Internal MCP initialize failed: ${JSON.stringify(payload)}`);
              modernSessionId=response.headers.get('mcp-session-id')||null;
              if(!modernSessionId)throw new Error('Internal MCP server did not issue a session ID for modern protocol adapter.');
              await fetch(`${UPSTREAM}${UPSTREAM_PATH}`,{
                method:'POST',headers:{'content-type':'application/json','accept':'application/json, text/event-stream','mcp-session-id':modernSessionId,'mcp-protocol-version':MCP_LEGACY},
                body:JSON.stringify({jsonrpc:'2.0',method:'notifications/initialized'}),signal:AbortSignal.timeout(15000),
              });
              return modernSessionId;
            })().catch(error=>{modernSessionPromise=null;throw error;});
            return modernSessionPromise;
          }

          async function upstreamRequest(req, payload, modern=false) {
            const headers={ 'content-type':'application/json', 'accept':'application/json, text/event-stream' };
            if(modern){
              headers['mcp-session-id']=await ensureModernSession();
              headers['mcp-protocol-version']=MCP_LEGACY;
            } else {
              for(const name of ['mcp-session-id','mcp-protocol-version','last-event-id','origin']) {
                const value=req.headers[name]; if(value) headers[name]=value;
              }
            }
            const response=await fetch(`${UPSTREAM}${UPSTREAM_PATH}`,{
              method:'POST',headers,body:JSON.stringify(payload),signal:AbortSignal.timeout(40000),
            });
            const raw=await response.text();
            let result=null;
            try { result=parseMcpResponse(raw); }
            catch { throw new Error(`Upstream Pascal MCP returned an unparseable response (${response.status}): ${raw.slice(0,500)}`); }
            return {response,result,raw};
          }

          const exportTool={
            name:'export_3d_to_viewer',
            description:'Create a frozen, standalone GLB 3D export from the current Pascal SceneGraph, save it to the Viewer exports folder, and immediately make that saved file appear in the 3D monitor. Call this only when the user explicitly asks to see a 3D export (for example: “3D export نشان بده”). This is NOT live synchronization: the viewer remains unchanged until this tool is called again. Supports architectural walls with rectangular door/window openings, slabs, ceilings, roofs with polygon outlines, columns, and dimensioned box items. Returns unsupported node types in the export report.',
            inputSchema:{type:'object',properties:{sceneId:{type:'string',description:'Optional Pascal saved scene ID to export. Omit to export the current/latest saved scene.'},filename:{type:'string',description:'Optional output base filename. The server adds a unique timestamp and .glb extension.'}},additionalProperties:false}
          };
          const statusTool={
            name:'get_latest_3d_export',
            description:'Return metadata and download/viewer URLs for the most recently saved GLB snapshot. Does not refresh or export the current Pascal scene.',
            inputSchema:{type:'object',properties:{},additionalProperties:false}
          };

          function sendJson(res,status,payload,extra={}) {
            cors(res);res.writeHead(status,{'content-type':'application/json; charset=utf-8','cache-control':'no-store',...extra});res.end(JSON.stringify(payload));
          }

          function addSnapshotTools(payload) {
            if(!payload?.result?.tools)return payload;
            const tools=payload.result.tools;const names=new Set(tools.map(tool=>tool.name));
            if(!names.has(exportTool.name))tools.push(exportTool);
            if(!names.has(statusTool.name))tools.push(statusTool);
            return payload;
          }

          function modernError(id,code,message) {
            return {jsonrpc:'2.0',id,error:{code,message}};
          }

          const server=http.createServer(async(req,res)=>{
            cors(res);
            if(req.method==='OPTIONS'){res.writeHead(204);res.end();return;}
            const url=new URL(req.url||'/','http://127.0.0.1');
            if(req.method==='GET'&&url.pathname==='/health'){
              sendJson(res,200,{ok:true,proxy:'pascal-mcp-export-proxy',customTools:[exportTool.name,statusTool.name],modernProtocol:MCP_MODERN,upstream:`${UPSTREAM}${UPSTREAM_PATH}`});return;
            }
            if(!(url.pathname==='/mcp'||url.pathname==='/mcp/')){sendJson(res,404,{error:'Not found'});return;}
            if(req.method==='GET'){
              try{
                const headers={accept:req.headers.accept||'text/event-stream'};
                if(req.headers['mcp-session-id'])headers['mcp-session-id']=req.headers['mcp-session-id'];
                const upstream=await fetch(`${UPSTREAM}${UPSTREAM_PATH}`,{method:'GET',headers});
                res.statusCode=upstream.status;
                for(const name of ['content-type','cache-control','mcp-session-id','mcp-protocol-version']){const value=upstream.headers.get(name);if(value)res.setHeader(name,value);}
                if(upstream.body)for await(const chunk of upstream.body)res.write(chunk);
                res.end();
              }catch(error){sendJson(res,502,{error:error?.message||String(error)});}return;
            }
            if(req.method!=='POST'){sendJson(res,405,{error:'Method not allowed'});return;}
            let currentRpcId=null;
            try{
              const payload=await readBody(req);
              currentRpcId=payload?.id??null;
              if(!payload||payload.jsonrpc!=='2.0'){sendJson(res,400,{error:'Invalid JSON-RPC payload'});return;}

              const incomingProtocol=req.headers['mcp-protocol-version']||'';
              const modern=incomingProtocol===MCP_MODERN||payload.method==='server/discover';
              if(modern){
                const incomingMethod=req.headers['mcp-method']||'';
                const incomingName=req.headers['mcp-name']||'';
                const meta=payload.params?._meta||{};
                const bodyProtocol=meta['io.modelcontextprotocol/protocolVersion']||'';
                if(incomingProtocol!==MCP_MODERN)return sendJson(res,400,modernError(currentRpcId,-32020,'MCP-Protocol-Version must be 2026-07-28.'));
                if(incomingMethod!==payload.method)return sendJson(res,400,modernError(currentRpcId,-32020,'Mcp-Method header must exactly match the JSON-RPC method.'));
                if(bodyProtocol!==MCP_MODERN)return sendJson(res,400,modernError(currentRpcId,-32020,'params._meta.io.modelcontextprotocol/protocolVersion must be 2026-07-28.'));
                if(['tools/call','resources/read','prompts/get'].includes(payload.method)){
                  const expected=String(payload.method==='resources/read'?(payload.params?.uri||''):(payload.params?.name||''));
                  if(!headerMatches(incomingName,expected))return sendJson(res,400,modernError(currentRpcId,-32020,'Mcp-Name header must match params.name or params.uri.'));
                }
                if(payload.method==='server/discover'){
                  sendJson(res,200,{jsonrpc:'2.0',id:payload.id,result:{
                    resultType:'complete',supportedVersions:[MCP_MODERN],capabilities:{tools:{}},
                    _meta:{'io.modelcontextprotocol/serverInfo':{name:'Pascal 3D Snapshot Export Monitor',version:'1.0.0'}},
                    instructions:'Controls saved Pascal scene data and creates a frozen GLB 3D export on explicit request. The Viewer does not live-sync scene edits.',
                    ttlMs:15000,cacheScope:'private'
                  }},{'mcp-protocol-version':MCP_MODERN});return;
                }
              }

              if(payload.method==='tools/call'&&payload.params?.name===exportTool.name){
                const args=payload.params.arguments||{};
                const response=await fetch(`${VIEWER}/api/export`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(args),signal:AbortSignal.timeout(120000)});
                const raw=await response.text();let data;
                try{data=JSON.parse(raw);}catch{throw new Error(`Viewer export API returned invalid JSON: ${raw.slice(0,500)}`);}
                if(!response.ok||data.ok===false)throw new Error(data.error||`Viewer export failed with HTTP ${response.status}`);
                const viewerUrl=VIEWER_PUBLIC||data.viewerUrl||'/';
                const result={...data,viewerUrl,downloadUrl:`${viewerUrl.replace(/\/$/,'')}/exports/latest.glb`,versionDownloadUrl:data.versionUrl?`${viewerUrl.replace(/\/$/,'')}${data.versionUrl}`:undefined};
                const headers=modern?{'mcp-protocol-version':MCP_MODERN}:{};
                sendJson(res,200,{jsonrpc:'2.0',id:payload.id,result:{content:[{type:'text',text:JSON.stringify(result)}],structuredContent:result,isError:false}},headers);return;
              }

              if(payload.method==='tools/call'&&payload.params?.name===statusTool.name){
                const response=await fetch(`${VIEWER}/api/export-status`,{cache:'no-store'});
                const data=await response.json();
                if(!response.ok)throw new Error(data.error||`Viewer status HTTP ${response.status}`);
                const viewerUrl=VIEWER_PUBLIC||'/';
                const result={...data.export,viewerUrl,downloadUrl:data.export?`${viewerUrl.replace(/\/$/,'')}/exports/latest.glb`:null};
                const headers=modern?{'mcp-protocol-version':MCP_MODERN}:{};
                sendJson(res,200,{jsonrpc:'2.0',id:payload.id,result:{content:[{type:'text',text:JSON.stringify(result)}],structuredContent:result,isError:false}},headers);return;
              }

              let forwardPayload=payload;
              if(modern){
                forwardPayload={...payload,params:{...(payload.params||{})}};
                delete forwardPayload.params._meta;
              }
              const forwarded=await upstreamRequest(req,forwardPayload,modern);
              if(payload.method==='tools/list'){
                addSnapshotTools(forwarded.result);
                const headers={};
                const session=forwarded.response.headers.get('mcp-session-id');
                if(!modern&&session)headers['mcp-session-id']=session;
                headers['mcp-protocol-version']=modern?MCP_MODERN:(forwarded.response.headers.get('mcp-protocol-version')||MCP_LEGACY);
                sendJson(res,200,forwarded.result||{},headers);return;
              }

              if(!forwarded.result&&payload.method?.startsWith('notifications/')){
                const headers={'cache-control':'no-store'};
                const session=forwarded.response.headers.get('mcp-session-id');
                if(!modern&&session)headers['mcp-session-id']=session;
                if(modern)headers['mcp-protocol-version']=MCP_MODERN;
                cors(res);res.writeHead(forwarded.response.status,headers);res.end();return;
              }
              const headers={'mcp-protocol-version':modern?MCP_MODERN:(forwarded.response.headers.get('mcp-protocol-version')||MCP_LEGACY)};
              const session=forwarded.response.headers.get('mcp-session-id');if(!modern&&session)headers['mcp-session-id']=session;
              sendJson(res,forwarded.response.status,forwarded.result||{},headers);
            }catch(error){
              console.error('MCP_EXPORT_PROXY_ERROR',error?.stack||error);
              if(currentRpcId!==null)sendJson(res,200,{jsonrpc:'2.0',id:currentRpcId,error:{code:-32000,message:error?.message||String(error)}},{'mcp-protocol-version':req.headers['mcp-protocol-version']||MCP_LEGACY});
              else sendJson(res,502,{error:error?.message||String(error)});
            }
          });

          server.listen(8788,'127.0.0.1',()=>console.log('Pascal MCP export proxy listening on 127.0.0.1:8788'));
          PROXY
          APP_DIR="$APP_DIR" \
          MCP_UPSTREAM="http://127.0.0.1:8787" \
          MCP_PATH="$MCP_PATH" \
          PASCAL_VIEWER_BASE="http://127.0.0.1:8090" \
          PASCAL_VIEWER_PUBLIC_URL="$VIEWER_URL" \
          nohup node "$RUNNER_TEMP/pascal-mcp-export-proxy.mjs" \
            > "$RUNNER_TEMP/pascal-mcp-export-proxy.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/pascal-mcp-export-proxy.pid"

          PROXY_READY=0
          for _ in $(seq 1 60); do
            CODE="$(curl -sS -o "$RUNNER_TEMP/proxy-health.json" -w '%{http_code}' http://127.0.0.1:8788/health 2>/dev/null || true)"
            if [[ "$CODE" == "200" ]]; then PROXY_READY=1; break; fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/pascal-mcp-export-proxy.pid")" 2>/dev/null; then
              echo "MCP export proxy exited unexpectedly:" >&2
              cat "$RUNNER_TEMP/pascal-mcp-export-proxy.log" >&2 || true
              exit 1
            fi
            sleep 1
          done
          if [[ "$PROXY_READY" != "1" ]]; then
            echo "MCP export proxy did not become ready:" >&2
            cat "$RUNNER_TEMP/pascal-mcp-export-proxy.log" >&2 || true
            exit 1
          fi

          # Verify the public-facing MCP facade exposes both snapshot commands and all native Pascal tools.
          export MCP_PATH
          node --input-type=module <<'NODE'
          const endpoint = `http://127.0.0.1:8788${process.env.MCP_PATH || '/mcp'}`;
          const protocol = '2025-06-18';
          let session;
          async function post(body) {
            const headers = {'content-type':'application/json','accept':'application/json, text/event-stream'};
            if (session) headers['mcp-session-id'] = session;
            if (body.method !== 'initialize') headers['mcp-protocol-version'] = protocol;
            const response = await fetch(endpoint,{method:'POST',headers,body:JSON.stringify(body),signal:AbortSignal.timeout(30000)});
            const raw = await response.text();
            const data = raw.split(/\r?\n/).filter(line=>line.startsWith('data:')).map(line=>line.slice(5).trimStart()).join('\n');
            const payload = data ? JSON.parse(data) : (raw.trim() ? JSON.parse(raw) : null);
            if (!response.ok || payload?.error) throw new Error(`Proxy MCP request failed (${response.status}): ${JSON.stringify(payload).slice(0,800)}`);
            return {response,payload};
          }
          const init = await post({jsonrpc:'2.0',id:1,method:'initialize',params:{protocolVersion:protocol,capabilities:{},clientInfo:{name:'snapshot-monitor-healthcheck',version:'1.0.0'}}});
          session = init.response.headers.get('mcp-session-id') || undefined;
          await post({jsonrpc:'2.0',method:'notifications/initialized'});
          const listed = await post({jsonrpc:'2.0',id:2,method:'tools/list',params:{}});
          const tools = listed.payload?.result?.tools || [];
          const names = new Set(tools.map(tool=>tool.name));
          for (const name of ['get_scene','save_scene','export_json','export_3d_to_viewer','get_latest_3d_export']) {
            if (!names.has(name)) throw new Error(`MCP proxy is missing tool ${name}`);
          }
          const modernMeta = {_meta:{'io.modelcontextprotocol/protocolVersion':'2026-07-28'}};
          async function modernPost(method,id,params={}) {
            const response=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json','accept':'application/json, text/event-stream','mcp-protocol-version':'2026-07-28','mcp-method':method},body:JSON.stringify({jsonrpc:'2.0',id,method,params:{...params,...modernMeta}})});
            const raw=await response.text();const result=raw.trim()?JSON.parse(raw):null;
            if(!response.ok||result?.error)throw new Error(`Modern MCP ${method} failed: ${JSON.stringify(result)}`);
            return result;
          }
          await modernPost('server/discover',3,{});
          const modernList=await modernPost('tools/list',4,{});
          if(!modernList?.result?.tools?.some(tool=>tool.name==='export_3d_to_viewer')) throw new Error('Modern MCP tool catalogue omitted export_3d_to_viewer.');
          console.log(`PASCAL_MCP_EXPORT_PROXY=PASS native_plus_snapshot_tools=${tools.length}`);
          console.log(`PASCAL_MCP_CUSTOM_TOOLS=PASS ${['export_3d_to_viewer','get_latest_3d_export'].join(',')}`);
          console.log('PASCAL_MCP_MODERN_PROTOCOL=PASS 2026-07-28');
          NODE
          MCP_TOOLS_COUNT=$((MCP_TOOLS_COUNT + 2))

          # Cloudflare publishes the MCP facade (port 8788), not the raw Pascal server.
          nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8788 \
            > "$RUNNER_TEMP/cloudflared-mcp.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/cloudflared-mcp.pid"
          MCP_TUNNEL_BASE="$(get_tunnel_url "$RUNNER_TEMP/cloudflared-mcp.log")"
          MCP_URL="${MCP_TUNNEL_BASE}${MCP_PATH}"
          echo "MCP_URL=$MCP_URL" >> "$GITHUB_ENV"
          echo "MCP_TOOLS_COUNT=$MCP_TOOLS_COUNT" >> "$GITHUB_ENV"
          echo "VIEWER_URL=$VIEWER_URL" >> "$GITHUB_OUTPUT"
          echo "MCP_URL=$MCP_URL" >> "$GITHUB_OUTPUT"
          echo "MCP_TOOLS_COUNT=$MCP_TOOLS_COUNT" >> "$GITHUB_OUTPUT"

          {
            echo "## Pascal 3D Snapshot Export Monitor"
            echo ""
            echo "- **3D monitor:** $VIEWER_URL"
            echo "- **MCP endpoint:** $MCP_URL"
            echo "- **MCP tools discovered:** $MCP_TOOLS_COUNT (including two snapshot tools)"
            echo "- **Display mode:** frozen GLB file; no continuous scene sync, no screenshot loop, and no background 3D rendering of the changing SceneGraph"
            echo "- **Export command:** `export_3d_to_viewer`"
            echo "- **Export status command:** `get_latest_3d_export`"
            echo "- **Storage:** `$RUNNER_TEMP/pascal-data/exports/` with `latest.glb`, timestamped version files, and `latest.json`"
            echo ""
            echo "> When the user explicitly requests a 3D export, the MCP command refreshes the current Pascal SceneGraph once, writes a standalone GLB file, and sends one export-complete event to the monitor. The monitor loads that saved GLB and remains unchanged until the next export. It does not stream model updates or screenshots. The current converter supports architectural walls with rectangular door/window openings, slabs, ceilings, roof polygons, columns, and dimensioned box items; unsupported node types are listed in the export report. The GLB and full project backup are downloadable from the monitor."
            echo ""
            echo "> Temporary test mode: no authentication is configured. Anyone who obtains the MCP Quick Tunnel URL may call write-capable tools. Stop this workflow when testing is finished."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "=================================================="
          echo "PASCAL 3D MONITOR : $VIEWER_URL"
          echo "PASCAL MCP      : $MCP_URL"
          echo "MCP TOOLS     : $MCP_TOOLS_COUNT"
          echo "=================================================="
          echo "Only the 3D snapshot monitor and the custom MCP facade are public. The raw Pascal MCP listener and Pascal Editor are not exposed."

      - name: Keep Pascal viewer and MCP alive
        shell: bash
        run: |
          set -Eeuo pipefail
          while true; do sleep 60; done
