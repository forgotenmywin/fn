
name: Pascal Editor and MCP - Windows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pascal-editor-mcp
  cancel-in-progress: true

jobs:
  pascal:
    name: Start Pascal Editor and MCP
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # --------------------------------------------------
      # 1. Environment
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - name: Validate configuration
        shell: pwsh
        env:
          PASCAL_MCP_HTTP_TOKEN: ${{ secrets.PASCAL_MCP_HTTP_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PASCAL_MCP_HTTP_TOKEN)) {
            throw "Missing repository secret: PASCAL_MCP_HTTP_TOKEN"
          }

          Write-Host "Node:"
          node --version

          Write-Host "NPM:"
          npm --version

          Write-Host "MCP authentication secret: configured"

      # --------------------------------------------------
      # 2. Shared Pascal storage
      # --------------------------------------------------

      - name: Prepare Pascal directories
        shell: pwsh
        run: |
          $home = Join-Path $env:RUNNER_TEMP "pascal-home"
          $data = Join-Path $home "data"

          New-Item -ItemType Directory -Force -Path $home | Out-Null
          New-Item -ItemType Directory -Force -Path $data | Out-Null

          Add-Content -Path $env:GITHUB_ENV -Value "PASCAL_HOME=$home"
          Add-Content -Path $env:GITHUB_ENV -Value "PASCAL_DATA_DIR=$data"

          Write-Host "Pascal home prepared."
          Write-Host "Shared data directory prepared."

      # --------------------------------------------------
      # 3. Start official Pascal Editor
      # --------------------------------------------------

      - name: Install and start Pascal Editor
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "pascal-editor.log"
          $stderr = Join-Path $env:RUNNER_TEMP "pascal-editor-error.log"

          Write-Host "Starting official Pascal CLI..."

          $output = & npx.cmd --yes @pascal-app/cli editor --no-open --json 2>&1
          $exitCode = $LASTEXITCODE

          $output | Out-File -FilePath $stdout -Encoding utf8

          Write-Host "Pascal CLI output:"
          Get-Content $stdout -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) {
            Write-Host "Pascal CLI failed."
            throw "Pascal Editor startup failed with exit code $exitCode."
          }

          Write-Host "Pascal CLI startup command completed."

          Start-Sleep -Seconds 5

          Write-Host "Checking Pascal status..."

          $status = & npx.cmd --yes @pascal-app/cli status --json 2>&1
          $statusExit = $LASTEXITCODE

          $status | Out-File `
            -FilePath (Join-Path $env:RUNNER_TEMP "pascal-status.json") `
            -Encoding utf8

          Write-Host "Pascal status:"
          Get-Content (Join-Path $env:RUNNER_TEMP "pascal-status.json")

          if ($statusExit -ne 0) {
            throw "Pascal status check failed."
          }

      # --------------------------------------------------
      # 4. Start official Pascal MCP HTTP server
      # --------------------------------------------------

      - name: Start Pascal MCP HTTP server
        shell: pwsh
        env:
          PASCAL_MCP_HTTP_TOKEN: ${{ secrets.PASCAL_MCP_HTTP_TOKEN }}
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "pascal-mcp.log"
          $stderr = Join-Path $env:RUNNER_TEMP "pascal-mcp-error.log"

          $command = "npx --yes --package=@pascal-app/mcp pascal-mcp --http --host 0.0.0.0 --port 8787"

          Write-Host "Starting Pascal MCP HTTP server..."

          $process = Start-Process `
            -FilePath $env:ComSpec `
            -ArgumentList @("/d", "/c", $command) `
            -WorkingDirectory $env:GITHUB_WORKSPACE `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru

          Add-Content -Path $env:GITHUB_ENV -Value "PASCAL_MCP_PID=$($process.Id)"

          Write-Host "MCP process PID: $($process.Id)"

          $ready = $false

          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2

            $process.Refresh()

            if ($process.HasExited) {
              Write-Host "MCP process exited unexpectedly."

              if (Test-Path $stdout) {
                Get-Content $stdout -Tail 100
              }

              if (Test-Path $stderr) {
                Get-Content $stderr -Tail 100
              }

              throw "Pascal MCP server process stopped."
            }

            try {
              $connection = Test-NetConnection `
                -ComputerName 127.0.0.1 `
                -Port 8787 `
                -WarningAction SilentlyContinue

              if ($connection.TcpTestSucceeded) {
                $ready = $true
                break
              }
            }
            catch {
              Write-Host "Waiting for local MCP..."
            }
          }

          if (-not $ready) {
            if (Test-Path $stdout) {
              Get-Content $stdout -Tail 100
            }

            if (Test-Path $stderr) {
              Get-Content $stderr -Tail 100
            }

            throw "MCP HTTP server did not open port 8787."
          }

          Write-Host "MCP TCP listener is ready."

      # --------------------------------------------------
      # 5. Local MCP protocol test
      # --------------------------------------------------

      - name: Verify local MCP
        shell: pwsh
        env:
          PASCAL_MCP_HTTP_TOKEN: ${{ secrets.PASCAL_MCP_HTTP_TOKEN }}
        run: |
          $bodyFile = Join-Path $env:RUNNER_TEMP "mcp-request.json"
          $responseFile = Join-Path $env:RUNNER_TEMP "mcp-local-response.txt"
          $headersFile = Join-Path $env:RUNNER_TEMP "mcp-local-headers.txt"
          $errorFile = Join-Path $env:RUNNER_TEMP "mcp-local-curl-error.txt"

          $payload = @{
            jsonrpc = "2.0"
            id = 1
            method = "initialize"
            params = @{
              protocolVersion = "2025-03-26"
              capabilities = @{}
              clientInfo = @{
                name = "pascal-github-actions"
                version = "1.0.0"
              }
            }
          } | ConvertTo-Json -Depth 10 -Compress

          [System.IO.File]::WriteAllText(
            $bodyFile,
            $payload,
            [System.Text.UTF8Encoding]::new($false)
          )

          $headers = @(
            "Authorization: Bearer $env:PASCAL_MCP_HTTP_TOKEN",
            "Accept: application/json, text/event-stream",
            "Content-Type: application/json"
          )

          $ready = $false

          for ($i = 1; $i -le 30; $i++) {
            $arguments = @(
              "--silent",
              "--show-error",
              "--connect-timeout", "8",
              "--max-time", "20",
              "--output", $responseFile,
              "--dump-header", $headersFile,
              "--stderr", $errorFile,
              "--write-out", "%{http_code}",
              "-X", "POST",
              "http://127.0.0.1:8787/mcp",
              "-H", $headers[0],
              "-H", $headers[1],
              "-H", $headers[2],
              "--data-binary", "@$bodyFile"
            )

            $result = & curl.exe @arguments
            $curlExit = $LASTEXITCODE
            $httpCode = ($result | Out-String).Trim()

            Write-Host "Local MCP attempt $i: HTTP $httpCode"

            if ($curlExit -eq 0 -and $httpCode -eq "200") {
              $ready = $true
              break
            }

            Start-Sleep -Seconds 3
          }

          if (-not $ready) {
            Write-Host "LOCAL MCP RESPONSE HEADERS:"
            if (Test-Path $headersFile) {
              Get-Content $headersFile
            }

            Write-Host "LOCAL MCP RESPONSE BODY:"
            if (Test-Path $responseFile) {
              Get-Content $responseFile -Raw
            }

            Write-Host "CURL ERROR:"
            if (Test-Path $errorFile) {
              Get-Content $errorFile
            }

            Write-Host "MCP SERVER LOG:"
            Get-Content (Join-Path $env:RUNNER_TEMP "pascal-mcp.log") -Tail 100

            Get-Content (Join-Path $env:RUNNER_TEMP "pascal-mcp-error.log") -Tail 100 -ErrorAction SilentlyContinue

            throw "Local MCP initialize failed."
          }

          Write-Host "LOCAL MCP INITIALIZE: SUCCESS"

          if (Test-Path $responseFile) {
            Write-Host "MCP initialize response:"
            Get-Content $responseFile -Raw
          }

      # --------------------------------------------------
      # 6. Download Cloudflare
      # --------------------------------------------------

      - name: Download Cloudflare Tunnel
        shell: pwsh
        run: |
          $cloudflared = Join-Path $env:RUNNER_TEMP "cloudflared.exe"

          $url = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $cloudflared `
            -UseBasicParsing

          if (-not (Test-Path $cloudflared)) {
            throw "Cloudflared download failed."
          }

          & $cloudflared --version

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "CLOUDFLARED_PATH=$cloudflared"

      # --------------------------------------------------
      # 7. Start Quick Tunnel
      # --------------------------------------------------

      - name: Start Cloudflare Quick Tunnel
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "cloudflare.log"
          $stderr = Join-Path $env:RUNNER_TEMP "cloudflare-error.log"

          $arguments = @(
            "tunnel",
            "--url",
            "http://127.0.0.1:8787",
            "--no-autoupdate",
            "--protocol",
            "http2",
            "--loglevel",
            "info"
          )

          $process = Start-Process `
            -FilePath $env:CLOUDFLARED_PATH `
            -ArgumentList $arguments `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru

          Add-Content -Path $env:GITHUB_ENV -Value "CLOUDFLARE_PID=$($process.Id)"

          Write-Host "Cloudflare PID: $($process.Id)"

          $publicUrl = $null

          for ($i = 1; $i -le 90; $i++) {
            Start-Sleep -Seconds 2

            $process.Refresh()

            if ($process.HasExited) {
              Write-Host "Cloudflare exited unexpectedly."

              if (Test-Path $stdout) {
                Get-Content $stdout -Tail 100
              }

              if (Test-Path $stderr) {
                Get-Content $stderr -Tail 100
              }

              throw "Cloudflare tunnel process stopped."
            }

            foreach ($file in @($stdout, $stderr)) {
              if (Test-Path $file) {
                $content = Get-Content $file -Raw -ErrorAction SilentlyContinue

                if ($content -match 'https://[a-zA-Z0-9-]+\.trycloudflare\.com') {
                  $publicUrl = $Matches[0]
                  break
                }
              }
            }

            if ($publicUrl) {
              break
            }
          }

          if (-not $publicUrl) {
            Write-Host "Cloudflare output:"
            if (Test-Path $stdout) {
              Get-Content $stdout -Tail 100
            }

            if (Test-Path $stderr) {
              Get-Content $stderr -Tail 100
            }

            throw "Cloudflare public URL was not detected."
          }

          Add-Content -Path $env:GITHUB_ENV -Value "PASCAL_PUBLIC_URL=$publicUrl"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "PASCAL PUBLIC URL"
          Write-Host $publicUrl
          Write-Host "=========================================="

      # --------------------------------------------------
      # 8. Public MCP diagnostic
      # --------------------------------------------------

      - name: Verify public MCP endpoint
        shell: pwsh
        env:
          PASCAL_MCP_HTTP_TOKEN: ${{ secrets.PASCAL_MCP_HTTP_TOKEN }}
        run: |
          $bodyFile = Join-Path $env:RUNNER_TEMP "mcp-request.json"
          $responseFile = Join-Path $env:RUNNER_TEMP "mcp-public-response.txt"
          $headersFile = Join-Path $env:RUNNER_TEMP "mcp-public-headers.txt"
          $errorFile = Join-Path $env:RUNNER_TEMP "mcp-public-curl-error.txt"

          $payload = @{
            jsonrpc = "2.0"
            id = 2
            method = "initialize"
            params = @{
              protocolVersion = "2025-03-26"
              capabilities = @{}
              clientInfo = @{
                name = "pascal-public-test"
                version = "1.0.0"
              }
            }
          } | ConvertTo-Json -Depth 10 -Compress

          [System.IO.File]::WriteAllText(
            $bodyFile,
            $payload,
            [System.Text.UTF8Encoding]::new($false)
          )

          $headers = @(
            "Authorization: Bearer $env:PASCAL_MCP_HTTP_TOKEN",
            "Accept: application/json, text/event-stream",
            "Content-Type: application/json"
          )

          $verified = $false
          $selectedPath = "/mcp"
          $lastStatus = "000"

          # Test both common endpoint forms.
          foreach ($path in @("/mcp", "/mcp/")) {
            Write-Host ""
            Write-Host "Testing public path: $path"

            $uri = "$env:PASCAL_PUBLIC_URL$path"

            for ($i = 1; $i -le 20; $i++) {
              $arguments = @(
                "--silent",
                "--show-error",
                "--connect-timeout", "10",
                "--max-time", "30",
                "--output", $responseFile,
                "--dump-header", $headersFile,
                "--stderr", $errorFile,
                "--write-out", "%{http_code}",
                "-X", "POST",
                $uri,
                "-H", $headers[0],
                "-H", $headers[1],
                "-H", $headers[2],
                "--data-binary", "@$bodyFile"
              )

              $result = & curl.exe @arguments
              $curlExit = $LASTEXITCODE
              $httpCode = ($result | Out-String).Trim()

              $lastStatus = $httpCode

              Write-Host "Attempt $i - HTTP $httpCode - curl exit $curlExit"

              if ($curlExit -eq 0 -and $httpCode -eq "200") {
                $verified = $true
                $selectedPath = $path
                break
              }

              Start-Sleep -Seconds 4
            }

            if ($verified) {
              break
            }
          }

          $mcpUrl = "$env:PASCAL_PUBLIC_URL$selectedPath"

          Add-Content -Path $env:GITHUB_ENV -Value "PASCAL_MCP_URL=$mcpUrl"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "PUBLIC MCP ENDPOINT"
          Write-Host $mcpUrl
          Write-Host "=========================================="

          if ($verified) {
            Add-Content -Path $env:GITHUB_ENV -Value "PASCAL_PUBLIC_VERIFY=SUCCESS"
            Write-Host "PUBLIC MCP INITIALIZE: SUCCESS"
          }
          else {
            Add-Content -Path $env:GITHUB_ENV -Value "PASCAL_PUBLIC_VERIFY=FAILED"

            Write-Warning "Public MCP verification failed. Runner will remain active for diagnosis."

            Write-Host ""
            Write-Host "LAST HTTP STATUS:"
            Write-Host $lastStatus

            Write-Host ""
            Write-Host "PUBLIC RESPONSE HEADERS:"
            if (Test-Path $headersFile) {
              Get-Content $headersFile -Tail 40
            }

            Write-Host ""
            Write-Host "PUBLIC RESPONSE BODY:"
            if (Test-Path $responseFile) {
              Get-Content $responseFile -Raw
            }

            Write-Host ""
            Write-Host "CURL ERROR:"
            if (Test-Path $errorFile) {
              Get-Content $errorFile -Raw
            }

            Write-Host ""
            Write-Host "CLOUDFLARE STDOUT:"
            Get-Content (Join-Path $env:RUNNER_TEMP "cloudflare.log") -Tail 80 -ErrorAction SilentlyContinue

            Write-Host ""
            Write-Host "CLOUDFLARE STDERR:"
            Get-Content (Join-Path $env:RUNNER_TEMP "cloudflare-error.log") -Tail 80 -ErrorAction SilentlyContinue
          }

      # --------------------------------------------------
      # 9. Publish links
      # --------------------------------------------------

      - name: Publish Pascal MCP connection details
        if: always()
        shell: pwsh
        run: |
          $publicUrl = $env:PASCAL_PUBLIC_URL
          $mcpUrl = $env:PASCAL_MCP_URL
          $verification = $env:PASCAL_PUBLIC_VERIFY

          $summary = @"
          # Pascal Editor and MCP

          **Editor URL**

          $publicUrl

          **MCP endpoint**

          $mcpUrl

          **Public MCP verification:** $verification

          **Transport:** Streamable HTTP

          **Authentication:** Bearer token

          **Token secret:** `PASCAL_MCP_HTTP_TOKEN`

          The bearer token is never printed in the logs.
          "@

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "PASCAL MCP CONNECTION"
          Write-Host $mcpUrl
          Write-Host "PUBLIC VERIFICATION: $verification"
          Write-Host "=========================================="

      # --------------------------------------------------
      # 10. Keep services alive
      # --------------------------------------------------

      - name: Keep Pascal and Cloudflare alive
        shell: pwsh
        run: |
          Write-Host "Pascal MCP is running."
          Write-Host "Cloudflare tunnel is running."
          Write-Host "Job will remain active."

          while ($true) {
            Start-Sleep -Seconds 30

            foreach ($id in @(
              $env:PASCAL_MCP_PID,
              $env:CLOUDFLARE_PID
            )) {
              $process = Get-Process -Id ([int]$id) -ErrorAction SilentlyContinue

              if (-not $process) {
                Write-Host "Required process stopped: $id"

                Write-Host "MCP logs:"
                Get-Content (Join-Path $env:RUNNER_TEMP "pascal-mcp.log") -Tail 80 -ErrorAction SilentlyContinue

                Write-Host "Cloudflare logs:"
                Get-Content (Join-Path $env:RUNNER_TEMP "cloudflare-error.log") -Tail 80 -ErrorAction SilentlyContinue

                throw "A required service process stopped."
              }
            }

            Write-Host "Heartbeat: $(Get-Date -Format o)"
          }
