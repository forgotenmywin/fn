name: Pascal Live 3D Viewer - Blank Page Fixed

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: pascal-viewer-only-session
  cancel-in-progress: true

jobs:
  pascal-viewer:
    name: Pascal headless MCP and read-only 3D viewer
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          # npm cache is intentionally disabled: this generated workspace has no lockfile.

      - name: Install Cloudflare Tunnel
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o "$RUNNER_TEMP/cloudflared.deb"
          sudo dpkg -i "$RUNNER_TEMP/cloudflared.deb"
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq zip
          fi
          cloudflared --version
          zip -v >/dev/null

      - name: Start headless Pascal MCP, build live 3D viewer, and publish endpoints
        id: stack
        shell: bash
        run: |
          set -Eeuo pipefail

          VERSION="1.0.6"
          PROJECT_NAME="Pascal Building Project"
          SCENE_FILE_NAME="Studio_Test.scene.json"
          DATA_DIR="$RUNNER_TEMP/pascal-data"
          APP_DIR="$RUNNER_TEMP/pascal-viewer-app"
          mkdir -p "$DATA_DIR" "$APP_DIR/src"
          chmod 700 "$DATA_DIR"

          # Last verified Pascal scene (Studio Test, 13 nodes). This is a real SceneGraph
          # exported from Pascal, not a screenshot or a generated placeholder. It is used
          # only if the local MCP starts with an empty 3-node scaffold.
          cat > "$APP_DIR/src/seed-scene.json" <<'SEEDJSON'
          {"nodes":{"site_odjz29my7rar7fa1":{"object":"node","id":"site_odjz29my7rar7fa1","type":"site","parentId":null,"visible":true,"metadata":{},"polygon":{"type":"polygon","points":[[-15,-15],[15,-15],[15,15],[-15,15]]},"children":["building_1v90m3u8j3gljuj9"]},"building_1v90m3u8j3gljuj9":{"object":"node","id":"building_1v90m3u8j3gljuj9","type":"building","parentId":"site_odjz29my7rar7fa1","visible":true,"metadata":{},"children":["level_52lh8wd8k1qi8rki"],"position":[0,0,0],"rotation":[0,0,0]},"level_52lh8wd8k1qi8rki":{"object":"node","id":"level_52lh8wd8k1qi8rki","type":"level","parentId":"building_1v90m3u8j3gljuj9","visible":true,"metadata":{},"children":["wall_mipwpw32vccydci6","wall_ibru9etld97piha9","wall_regrtdi389qmc388","wall_k0wlbxwi1e5jbuie","zone_vfk52c5ti6u20a8e","ceiling_am6mowoee4gzfmun","slab_00014pkp85xywjne"],"level":0,"baseElevation":0,"height":2.5},"wall_mipwpw32vccydci6":{"object":"node","id":"wall_mipwpw32vccydci6","type":"wall","name":"Wall 1","parentId":"level_52lh8wd8k1qi8rki","visible":true,"metadata":{},"children":["door_f2uqc2jplcrs5c4i"],"thickness":0.2,"height":2.5,"start":[-4,-3],"end":[4,-3],"frontSide":"interior","backSide":"exterior"},"wall_ibru9etld97piha9":{"object":"node","id":"wall_ibru9etld97piha9","type":"wall","name":"Wall 2","parentId":"level_52lh8wd8k1qi8rki","visible":true,"metadata":{},"children":[],"thickness":0.2,"height":2.5,"start":[4,-3],"end":[4,3],"frontSide":"interior","backSide":"exterior"},"wall_regrtdi389qmc388":{"object":"node","id":"wall_regrtdi389qmc388","type":"wall","name":"Wall 3","parentId":"level_52lh8wd8k1qi8rki","visible":true,"metadata":{},"children":["window_qpvdeiumyt2kexu5"],"thickness":0.2,"height":2.5,"start":[4,3],"end":[-4,3],"frontSide":"interior","backSide":"exterior"},"wall_k0wlbxwi1e5jbuie":{"object":"node","id":"wall_k0wlbxwi1e5jbuie","type":"wall","name":"Wall 4","parentId":"level_52lh8wd8k1qi8rki","visible":true,"metadata":{},"children":["window_crcr90bnp3jrb5k6"],"thickness":0.2,"height":2.5,"start":[-4,3],"end":[-4,-3],"frontSide":"interior","backSide":"exterior"},"zone_vfk52c5ti6u20a8e":{"object":"node","id":"zone_vfk52c5ti6u20a8e","type":"zone","name":"Studio Test","parentId":"level_52lh8wd8k1qi8rki","visible":true,"metadata":{},"polygon":[[-4,-3],[4,-3],[4,3],[-4,3]],"holes":[],"autoFromWalls":true,"boundaryWallIds":["wall_ibru9etld97piha9","wall_k0wlbxwi1e5jbuie","wall_mipwpw32vccydci6","wall_regrtdi389qmc388"],"boundarySeparatorIds":[],"seed":[0,0],"spaceRole":"room","roomNumber":"","enclosureStatus":"enclosed","floorFinish":"","wallFinish":"","ceilingFinish":"","ceilingHeight":2.7,"occupancy":"","clearDimensionPolicy":"none","color":"#f59e0b"},"door_f2uqc2jplcrs5c4i":{"object":"node","id":"door_f2uqc2jplcrs5c4i","type":"door","name":"Door 1","parentId":"wall_mipwpw32vccydci6","visible":true,"metadata":{},"position":[4,1.05,0],"rotation":[0,3.141592653589793,0],"side":"back","floorThresholdVersion":1,"wallId":"wall_mipwpw32vccydci6","width":0.95,"height":2.1,"constructionType":"framed","dimensionReference":"nominal","doorCategory":"interior","doorType":"hinged","leafCount":1,"operationState":0,"slideDirection":"left","trackStyle":"none","garagePanelCount":4,"openingKind":"door","openingShape":"rectangle","openingRadiusMode":"all","openingTopRadii":[0.15,0.15],"cornerRadius":0.15,"archHeight":0.45,"openingRevealRadius":0.025,"frameThickness":0.05,"frameDepth":0.07,"threshold":true,"thresholdHeight":0.02,"hingesSide":"left","swingDirection":"inward","swingAngle":0,"segments":[{"type":"panel","heightRatio":1,"columnRatios":[1],"dividerThickness":0.03,"panelDepth":0,"panelInset":0}],"handle":true,"handleHeight":1.05,"handleSide":"right","contentPadding":[0,0],"doorCloser":false,"panicBar":false,"panicBarHeight":1},"window_qpvdeiumyt2kexu5":{"object":"node","id":"window_qpvdeiumyt2kexu5","type":"window","name":"Window 1","parentId":"wall_regrtdi389qmc388","visible":true,"metadata":{},"position":[4,1.5,0],"rotation":[0,0,0],"floorThresholdVersion":1,"wallId":"wall_regrtdi389qmc388","width":1.8,"height":1.2,"constructionType":"framed","dimensionReference":"nominal","openingKind":"window","windowType":"fixed","operationState":0,"awningDirection":"up","casementStyle":"single","hingesSide":"left","openingShape":"rectangle","openingRadiusMode":"all","openingCornerRadii":[0.15,0.15,0.15,0.15],"cornerRadius":0.15,"archHeight":0.35,"openingRevealRadius":0.025,"frameThickness":0.05,"frameDepth":0.07,"columnRatios":[1],"rowRatios":[1],"columnDividerThickness":0.03,"rowDividerThickness":0.03,"sill":true,"sillDepth":0.08,"sillThickness":0.03},"window_crcr90bnp3jrb5k6":{"object":"node","id":"window_crcr90bnp3jrb5k6","type":"window","name":"Window 2","parentId":"wall_k0wlbxwi1e5jbuie","visible":true,"metadata":{},"position":[3,1.5,0],"rotation":[0,0,0],"floorThresholdVersion":1,"wallId":"wall_k0wlbxwi1e5jbuie","width":1.5,"height":1.2,"constructionType":"framed","dimensionReference":"nominal","openingKind":"window","windowType":"fixed","operationState":0,"awningDirection":"up","casementStyle":"single","hingesSide":"left","openingShape":"rectangle","openingRadiusMode":"all","openingCornerRadii":[0.15,0.15,0.15,0.15],"cornerRadius":0.15,"archHeight":0.35,"openingRevealRadius":0.025,"frameThickness":0.05,"frameDepth":0.07,"columnRatios":[1],"rowRatios":[1],"columnDividerThickness":0.03,"rowDividerThickness":0.03,"sill":true,"sillDepth":0.08,"sillThickness":0.03},"ceiling_am6mowoee4gzfmun":{"object":"node","id":"ceiling_am6mowoee4gzfmun","type":"ceiling","name":"Studio Test Ceiling","parentId":"level_52lh8wd8k1qi8rki","visible":true,"metadata":{},"children":[],"polygon":[[-4,-3],[4,-3],[4,3],[-4,3]],"holes":[],"holeMetadata":[],"boundary":"auto","zoneId":"zone_vfk52c5ti6u20a8e","autoFromWalls":true},"slab_00014pkp85xywjne":{"object":"node","id":"slab_00014pkp85xywjne","type":"slab","name":"Floor plate","parentId":"level_52lh8wd8k1qi8rki","visible":true,"metadata":{},"polygon":[[-4.1,-3.1],[4.1,-3.1],[4.1,3.1],[-4.1,3.1]],"holes":[],"holeMetadata":[],"elevation":0.05,"foundation":{"type":"none"},"thickness":0.05,"recessed":false,"boundary":"auto","plateRole":"base","zoneIds":["zone_vfk52c5ti6u20a8e"],"autoFromWalls":true}},"rootNodeIds":["site_odjz29my7rar7fa1"],"collections":{},"materials":{}}
          SEEDJSON

          echo "Pascal version: $VERSION"
          echo "Project label: $PROJECT_NAME"
          echo "Scene filename: $SCENE_FILE_NAME"
          echo "Shared scene database: $DATA_DIR"

          # MCP is headless. The official Viewer package below is the only UI exposed to the user.
          (
            export PASCAL_DATA_DIR="$DATA_DIR"
            export PASCAL_DB_PATH="$DATA_DIR/pascal.db"
            exec npm exec --yes --package="@pascal-app/mcp@${VERSION}" -- \
              pascal-mcp --http --host 127.0.0.1 --port 8787 \
              --cors-origin https://chatgpt.com \
              --cors-origin https://chat.openai.com
          ) > "$RUNNER_TEMP/pascal-mcp.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/pascal-mcp.pid"

          echo "Waiting for Pascal MCP listener..."
          MCP_READY=0
          for _ in $(seq 1 90); do
            if ss -ltn | grep -qE '127\.0\.0\.1:8787|\[::1\]:8787'; then
              MCP_READY=1
              break
            fi
            sleep 2
          done
          if [[ "$MCP_READY" != "1" ]]; then
            echo "Pascal MCP did not start. MCP log:" >&2
            tail -n 180 "$RUNNER_TEMP/pascal-mcp.log" >&2 || true
            exit 1
          fi
          echo "PASCAL_MCP_LISTENER=PASS"

          # Verify a real MCP initialize, complete tool catalogue, and scene read.
          node --input-type=module <<'NODE' | tee "$RUNNER_TEMP/mcp-probe.txt"
          const base = 'http://127.0.0.1:8787';
          const protocolVersion = '2025-06-18';
          let sessionId;

          function parseBody(raw) {
            const data = raw.split(/\r?\n/).filter(line => line.startsWith('data:'))
              .map(line => line.slice(5).trimStart()).join('\n');
            if (data) return JSON.parse(data);
            if (!raw.trim()) return null;
            return JSON.parse(raw.trim());
          }

          async function post(path, body) {
            const headers = {
              'content-type': 'application/json',
              'accept': 'application/json, text/event-stream',
            };
            if (sessionId) headers['mcp-session-id'] = sessionId;
            if (body.method !== 'initialize') headers['mcp-protocol-version'] = protocolVersion;
            const response = await fetch(`${base}${path}`, {
              method: 'POST', headers, body: JSON.stringify(body),
              signal: AbortSignal.timeout(25000),
            });
            const raw = await response.text();
            let payload = null;
            try { payload = parseBody(raw); } catch {
              throw new Error(`Unparseable MCP response (${response.status}): ${raw.slice(0, 600)}`);
            }
            return { response, payload };
          }

          let connected = null;
          let lastError = null;
          for (const path of ['/mcp', '/mcp/']) {
            try {
              const init = await post(path, {
                jsonrpc: '2.0', id: 1, method: 'initialize',
                params: {
                  protocolVersion,
                  capabilities: {},
                  clientInfo: { name: 'pascal-viewer-workflow', version: '1.0.0' },
                },
              });
              if (init.response.status === 404 || init.response.status === 405) continue;
              if (!init.response.ok || init.payload?.error) {
                throw new Error(`initialize failed ${init.response.status}: ${JSON.stringify(init.payload)}`);
              }
              sessionId = init.response.headers.get('mcp-session-id') || undefined;
              await post(path, { jsonrpc: '2.0', method: 'notifications/initialized' });
              const listed = await post(path, {
                jsonrpc: '2.0', id: 2, method: 'tools/list', params: {},
              });
              if (!listed.response.ok || listed.payload?.error) {
                throw new Error(`tools/list failed: ${JSON.stringify(listed.payload)}`);
              }
              const tools = listed.payload?.result?.tools;
              if (!Array.isArray(tools) || !tools.length) throw new Error('MCP returned an empty tool list.');
              const names = new Set(tools.map(tool => tool.name));
              const required = ['get_scene', 'list_scenes', 'save_scene', 'export_json', 'load_scene'];
              const missing = required.filter(name => !names.has(name));
              if (missing.length) throw new Error(`Required Pascal tools are missing: ${missing.join(', ')}`);
              const scene = await post(path, {
                jsonrpc: '2.0', id: 3, method: 'tools/call',
                params: { name: 'get_scene', arguments: {} },
              });
              if (!scene.response.ok || scene.payload?.error || scene.payload?.result?.isError) {
                throw new Error(`get_scene failed: ${JSON.stringify(scene.payload).slice(0, 900)}`);
              }
              connected = { path, tools };
              break;
            } catch (error) { lastError = error; }
          }
          if (!connected) throw new Error(`MCP handshake failed: ${lastError?.message || 'endpoint not found'}`);
          console.log(`MCP_PATH=${connected.path}`);
          console.log(`MCP_TOOLS_COUNT=${connected.tools.length}`);
          console.log(`MCP_TOOLS=${connected.tools.map(tool => tool.name).join(',')}`);
          console.log('MCP_GET_SCENE=PASS');
          console.log('MCP_REQUIRED_TOOLS=PASS');
          NODE

          MCP_PATH="$(sed -n 's/^MCP_PATH=//p' "$RUNNER_TEMP/mcp-probe.txt" | tail -n 1)"
          MCP_TOOLS_COUNT="$(sed -n 's/^MCP_TOOLS_COUNT=//p' "$RUNNER_TEMP/mcp-probe.txt" | tail -n 1)"
          if [[ -z "$MCP_PATH" || -z "$MCP_TOOLS_COUNT" ]]; then
            echo "MCP probe did not report a usable tool catalogue." >&2
            tail -n 180 "$RUNNER_TEMP/pascal-mcp.log" >&2 || true
            exit 1
          fi

          # Publish only the MCP endpoint. No public Editor tunnel is created.
          nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8787 \
            > "$RUNNER_TEMP/cloudflared-mcp.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/cloudflared-mcp.pid"

          get_tunnel_url() {
            local logfile="$1"
            local url=""
            for _ in $(seq 1 60); do
              url="$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$logfile" 2>/dev/null | tail -n 1 || true)"
              if [[ -n "$url" ]]; then printf '%s' "$url"; return 0; fi
              sleep 2
            done
            echo "Cloudflare did not issue a Quick Tunnel URL. Log: $logfile" >&2
            tail -n 100 "$logfile" >&2 || true
            return 1
          }

          MCP_TUNNEL_BASE="$(get_tunnel_url "$RUNNER_TEMP/cloudflared-mcp.log")"
          MCP_URL="${MCP_TUNNEL_BASE}${MCP_PATH}"
          echo "MCP_URL=$MCP_URL" >> "$GITHUB_ENV"
          echo "MCP_TOOLS_COUNT=$MCP_TOOLS_COUNT" >> "$GITHUB_ENV"
          echo "MCP endpoint: $MCP_URL"
          echo "MCP tools discovered: $MCP_TOOLS_COUNT"

          # Generate a small React host around Pascal's official read-only Viewer.
          cd "$APP_DIR"
          npm init -y >/dev/null
          npm install --no-audit --no-fund \
            "@pascal-app/core@${VERSION}" \
            "@pascal-app/viewer@${VERSION}" \
            "@pascal-app/nodes@${VERSION}" \
            "react@^19" "react-dom@^19" \
            "next@latest" \
            "three@^0.186.1" \
            "@react-three/fiber@^9.8.2" \
            "@react-three/drei@^10.7.9" \
            "lucide-react" "zustand@^5" "vite@^7"

          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="fa" dir="rtl">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <meta name="color-scheme" content="dark" />
              <title>Pascal Live 3D Viewer</title>
            </head>
            <body>
              <div id="root">
                <main class="boot-screen">
                  <div class="boot-card">
                    <div class="boot-mark">P</div>
                    <h1>Pascal 3D Viewer</h1>
                    <p>در حال بارگذاری نمایشگر سه‌بعدی…</p>
                    <small>در حال دریافت موتور نمایش و صحنهٔ ذخیره‌شده</small>
                  </div>
                </main>
              </div>
              <div id="fatal-runtime" role="alert" hidden></div>
              <script>
                window.__PASCAL_APP_MOUNTED = false;
                (() => {
                  const panel = document.getElementById('fatal-runtime');
                  const show = (message) => {
                    panel.hidden = false;
                    panel.textContent = 'خطای راه‌اندازی نمایشگر: ' + String(message || 'خطای نامشخص') + ' | F12 → Console برای جزئیات';
                  };
                  window.addEventListener('error', (event) => {
                    show(event.message || event.filename || 'بارگذاری JavaScript ناموفق بود');
                  }, true);
                  window.addEventListener('unhandledrejection', (event) => {
                    show(event.reason?.stack || event.reason?.message || event.reason);
                  });
                  setTimeout(() => {
                    if (!window.__PASCAL_APP_MOUNTED) show('React mount تا ۲۵ ثانیه کامل نشد؛ بسته‌های Viewer یا فایل‌های frontend را بررسی کنید.');
                  }, 25000);
                })();
              </script>
              <script type="module" src="/src/main.jsx"></script>
            </body>
          </html>
          HTML

          cat > src/main.jsx <<'JS'
          import React, { useEffect, useState } from 'react';
          import { createRoot } from 'react-dom/client';
          import { loadPlugin, useScene } from '@pascal-app/core';
          import { builtinPlugin } from '@pascal-app/nodes';
          import { Viewer, useViewer } from '@pascal-app/viewer';
          import seedGraph from './seed-scene.json';
          import './style.css';

          // Pascal requires the built-in renderer plugin to finish loading before Viewer mounts.
          const registryReady = loadPlugin(builtinPlugin);
          const GEOMETRY_TYPES = new Set(['wall', 'slab', 'ceiling', 'roof', 'door', 'window', 'item', 'imported-mesh']);

          function hasBuildingGeometry(graph) {
            return Object.values(graph?.nodes || {}).some(node => GEOMETRY_TYPES.has(node?.type));
          }

          function selectDefaultLevel(graph) {
            const nodes = graph?.nodes || {};
            const rootNodes = (graph?.rootNodeIds || []).map(id => nodes[id]).filter(Boolean);
            const building = rootNodes.find(node => node?.type === 'building') ||
              Object.values(nodes).find(node => node?.type === 'building');
            if (!building) return;
            const childIds = Array.isArray(building.children) ? building.children : [];
            const levels = childIds.map(id => nodes[id]).filter(node => node?.type === 'level');
            const level = levels.find(node => node.level === 0) || levels[0];
            if (level) {
              useViewer.getState().setSelection({
                buildingId: building.id,
                levelId: level.id,
                selectedIds: [],
                zoneId: null,
              });
            }
          }

          function applyGraph(graph) {
            if (!graph?.nodes || !Array.isArray(graph.rootNodeIds) || !graph.rootNodeIds.length) {
              throw new Error('SceneGraph نامعتبر است: nodes یا rootNodeIds وجود ندارد.');
            }
            useViewer.getState().resetSelection();
            // This is the same SceneStore API used by Pascal's own editor host.
            useScene.getState().setScene(
              graph.nodes,
              graph.rootNodeIds,
              {
                collections: graph.collections || {},
                materials: graph.materials || {},
                installedPlugins: graph.installedPlugins || [],
              },
            );
            selectDefaultLevel(graph);
          }

          class ViewerErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { error: null }; }
            static getDerivedStateFromError(error) { return { error }; }
            componentDidCatch(error, info) {
              console.error('Pascal Viewer React render failed:', error, info);
            }
            render() {
              if (this.state.error) {
                return <main className="fatal-page"><h1>نمایشگر سه‌بعدی متوقف شد</h1><pre>{String(this.state.error?.stack || this.state.error)}</pre><p>جزئیات کامل در F12 → Console موجود است.</p></main>;
              }
              return this.props.children;
            }
          }

          function App() {
            const [ready, setReady] = useState(false);
            const [meta, setMeta] = useState({
              projectName: 'Pascal Building Project',
              fileName: 'Studio_Test.scene.json',
              sceneId: '94e75adf891e',
            });
            const [saving, setSaving] = useState(false);
            const [saved, setSaved] = useState(false);
            const [error, setError] = useState('');
            const [usingSeed, setUsingSeed] = useState(false);
            const [nodeCount, setNodeCount] = useState(Object.keys(seedGraph.nodes).length);

            useEffect(() => {
              window.__PASCAL_APP_MOUNTED = true;
              let stopped = false;
              let stream = null;

              const receiveGraph = (data) => {
                if (data.meta) setMeta(previous => ({ ...previous, ...data.meta }));
                const incoming = data.graph;
                const useSavedFallback = !hasBuildingGeometry(incoming);
                const graph = useSavedFallback ? seedGraph : incoming;
                if (graph) {
                  applyGraph(graph);
                  setUsingSeed(useSavedFallback);
                  setNodeCount(Object.keys(graph.nodes || {}).length);
                  setError(data.error ? String(data.error) : '');
                } else if (data.error) {
                  setError(String(data.error));
                }
              };

              const start = async () => {
                try {
                  await registryReady;
                  if (stopped) return;
                  setReady(true);
                  const response = await fetch('/api/state', { cache: 'no-store' });
                  if (!response.ok) throw new Error(`GET /api/state: HTTP ${response.status}`);
                  receiveGraph(await response.json());
                  if (stopped) return;

                  stream = new EventSource('/api/events');
                  stream.addEventListener('graph', event => {
                    try { receiveGraph(JSON.parse(event.data)); }
                    catch (cause) { setError(`دادهٔ صحنه قابل اعمال نیست: ${cause?.message || cause}`); }
                  });
                  stream.addEventListener('status', event => {
                    try {
                      const data = JSON.parse(event.data);
                      if (data.error) setError(String(data.error));
                    } catch (cause) { console.warn('Invalid status event', cause); }
                  });
                  stream.onerror = () => setError('اتصال رویدادهای زنده قطع شده؛ مرورگر در حال تلاش مجدد است.');
                } catch (cause) {
                  console.error('Pascal Viewer startup failed:', cause);
                  setError(`راه‌اندازی نمایشگر ناموفق بود: ${cause?.message || cause}`);
                }
              };

              start();
              return () => {
                stopped = true;
                stream?.close();
                window.__PASCAL_APP_MOUNTED = false;
              };
            }, []);

            const saveScene = async () => {
              if (saving) return;
              setSaving(true);
              setSaved(false);
              setError('');
              try {
                const response = await fetch('/api/save', { method: 'POST' });
                if (!response.ok) throw new Error((await response.text()) || `HTTP ${response.status}`);
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const anchor = document.createElement('a');
                anchor.href = url;
                anchor.download = (meta.fileName || 'Studio_Test.scene.json')
                  .replace(/\.scene\.json$/i, '.pascal-backup.zip')
                  .replace(/\.json$/i, '.pascal-backup.zip');
                document.body.appendChild(anchor);
                anchor.click();
                anchor.remove();
                setTimeout(() => URL.revokeObjectURL(url), 3000);
                setSaved(true);
                setTimeout(() => setSaved(false), 2500);
              } catch (cause) {
                setError(`ذخیره انجام نشد: ${cause?.message || cause}`);
              } finally {
                setSaving(false);
              }
            };

            return (
              <main className="app-shell">
                <header className="topbar">
                  <div className="meta-block">
                    <span className="meta-label">پروژه</span>
                    <strong className="meta-value" title={meta.projectName}>{meta.projectName}</strong>
                  </div>
                  <div className="meta-block file-block">
                    <span className="meta-label">نام فایل</span>
                    <strong className="meta-value" title={meta.fileName}>{meta.fileName}</strong>
                  </div>
                  <div className="scene-status">{usingSeed ? 'صحنهٔ ذخیره‌شده' : 'اتصال زنده'} · {nodeCount} گره</div>
                  <button className="save-button" onClick={saveScene} disabled={saving || !ready}>
                    {saving ? 'در حال ذخیره…' : saved ? 'ذخیره شد' : 'ذخیره پشتیبان'}
                  </button>
                </header>
                <section className="viewer-area">
                  {ready ? <Viewer /> : <div className="loading">در حال آماده‌سازی موتور سه‌بعدی…</div>}
                  {usingSeed && <div className="scene-note">مدل آزمایشی ذخیره‌شده از Pascal نمایش داده می‌شود. به‌محض دریافت SceneGraph دارای هندسه از MCP، این نما با صحنهٔ زنده جایگزین می‌شود.</div>}
                  {error && <div className="error-message">{error}</div>}
                </section>
              </main>
            );
          }

          const root = createRoot(document.getElementById('root'), {
            onRecoverableError(error) { console.error('React recoverable error:', error); },
          });
          root.render(<ViewerErrorBoundary><App /></ViewerErrorBoundary>);
