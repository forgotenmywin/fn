name: Pascal Editor · Plugins, Browser Export and MCP

'on':
  workflow_dispatch:
    inputs:
      channel:
        description: Official Pascal container release channel
        required: true
        type: choice
        default: latest
        options:
          - latest
          - beta
      keep_running:
        description: Keep Pascal and both public tunnels running until the job is cancelled or times out
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: pascal-editor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pascal-editor:
    name: Start Pascal Editor, Plugins, Exporter and MCP
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      PASCAL_ADMIN_PASSWORD: ${{ secrets.PASCAL_ADMIN_PASSWORD }}
      PASCAL_SCENE_API_TOKEN: ${{ secrets.PASCAL_SCENE_API_TOKEN }}
      PASCAL_MCP_HTTP_TOKEN: ${{ secrets.PASCAL_MCP_HTTP_TOKEN }}
      PASCAL_IMAGE: ghcr.io/pascalorg/pascal-editor:${{ inputs.channel }}

    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Restore Pascal project database
        uses: actions/cache/restore@v4
        with:
          path: pascal-data
          key: pascal-data-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            pascal-data-${{ github.ref_name }}-
            pascal-data-

      - name: Prepare persistent data directory
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p pascal-data
          chmod 777 pascal-data

      - name: Create Pascal credentials
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ -n "${PASCAL_ADMIN_PASSWORD:-}" ]] || PASCAL_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          [[ -n "${PASCAL_SCENE_API_TOKEN:-}" ]] || PASCAL_SCENE_API_TOKEN="$(openssl rand -hex 32)"
          [[ -n "${PASCAL_MCP_HTTP_TOKEN:-}" ]] || PASCAL_MCP_HTTP_TOKEN="$(openssl rand -hex 32)"

          {
            printf 'PASCAL_ADMIN_PASSWORD=%s\n' "$PASCAL_ADMIN_PASSWORD"
            printf 'PASCAL_SCENE_API_TOKEN=%s\n' "$PASCAL_SCENE_API_TOKEN"
            printf 'PASCAL_MCP_HTTP_TOKEN=%s\n' "$PASCAL_MCP_HTTP_TOKEN"
          } >> "$GITHUB_ENV"

          {
            echo '## Pascal Editor credentials'
            echo
            echo '**Editor admin password**'
            echo '```text'
            printf '%s\n' "$PASCAL_ADMIN_PASSWORD"
            echo '```'
            echo
            echo '**MCP bearer token**'
            echo '```text'
            printf '%s\n' "$PASCAL_MCP_HTTP_TOKEN"
            echo '```'
            echo
            echo 'Keep this workflow run private. Anyone who can read this job summary can read these credentials.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Cloudflare Quick Tunnel
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            --output /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Install Bun for the official Pascal MCP server
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Start Pascal Editor Quick Tunnel
        id: editor_tunnel
        shell: bash
        run: |
          set -Eeuo pipefail

          LOG_FILE="$RUNNER_TEMP/pascal-editor-tunnel.log"
          PID_FILE="$RUNNER_TEMP/pascal-editor-tunnel.pid"

          nohup cloudflared tunnel \
            --url http://127.0.0.1:3000 \
            --no-autoupdate \
            --loglevel info \
            > "$LOG_FILE" 2>&1 < /dev/null &
          echo "$!" > "$PID_FILE"

          PUBLIC_URL=''
          for attempt in $(seq 1 90); do
            PUBLIC_URL="$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$LOG_FILE" | head -n 1 || true)"
            [[ -n "$PUBLIC_URL" ]] && break
            if ! kill -0 "$(cat "$PID_FILE")" 2>/dev/null; then
              cat "$LOG_FILE" || true
              echo 'Pascal editor tunnel exited before publishing its URL.' >&2
              exit 1
            fi
            sleep 2
          done

          [[ -n "$PUBLIC_URL" ]] || { cat "$LOG_FILE" || true; echo 'Could not obtain the Pascal editor tunnel URL.' >&2; exit 1; }

          echo "public_url=$PUBLIC_URL" >> "$GITHUB_OUTPUT"
          echo "PASCAL_PUBLIC_URL=$PUBLIC_URL" >> "$GITHUB_ENV"

      - name: Start Pascal MCP Quick Tunnel
        id: mcp_tunnel
        shell: bash
        run: |
          set -Eeuo pipefail

          LOG_FILE="$RUNNER_TEMP/pascal-mcp-tunnel.log"
          PID_FILE="$RUNNER_TEMP/pascal-mcp-tunnel.pid"

          nohup cloudflared tunnel \
            --url http://127.0.0.1:8787 \
            --no-autoupdate \
            --loglevel info \
            > "$LOG_FILE" 2>&1 < /dev/null &
          echo "$!" > "$PID_FILE"

          PUBLIC_URL=''
          for attempt in $(seq 1 90); do
            PUBLIC_URL="$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$LOG_FILE" | head -n 1 || true)"
            [[ -n "$PUBLIC_URL" ]] && break
            if ! kill -0 "$(cat "$PID_FILE")" 2>/dev/null; then
              cat "$LOG_FILE" || true
              echo 'Pascal MCP tunnel exited before publishing its URL.' >&2
              exit 1
            fi
            sleep 2
          done

          [[ -n "$PUBLIC_URL" ]] || { cat "$LOG_FILE" || true; echo 'Could not obtain the Pascal MCP tunnel URL.' >&2; exit 1; }

          echo "public_url=$PUBLIC_URL" >> "$GITHUB_OUTPUT"
          echo "PASCAL_MCP_PUBLIC_URL=$PUBLIC_URL/mcp" >> "$GITHUB_ENV"

      - name: Pull official Pascal Editor image
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull "$PASCAL_IMAGE"

      - name: Start Pascal Editor with persistent scene storage
        shell: bash
        run: |
          set -Eeuo pipefail

          docker rm -f pascal-editor >/dev/null 2>&1 || true
          docker run --detach \
            --name pascal-editor \
            --restart unless-stopped \
            --publish 127.0.0.1:3000:3000 \
            --env PASCAL_ADMIN_PASSWORD \
            --env PASCAL_SCENE_API_TOKEN \
            --env PASCAL_PUBLIC_URL \
            --volume "$GITHUB_WORKSPACE/pascal-data:/data" \
            "$PASCAL_IMAGE"

      - name: Wait for Pascal Editor readiness
        shell: bash
        run: |
          set -Eeuo pipefail

          READY=0
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null 2>&1; then
              READY=1
              break
            fi
            if [[ "$(docker inspect -f '{{.State.Running}}' pascal-editor 2>/dev/null || echo false)" != 'true' ]]; then
              docker logs --tail 200 pascal-editor || true
              echo 'Pascal container stopped during startup.' >&2
              exit 1
            fi
            sleep 3
          done

          [[ "$READY" == '1' ]] || { docker logs --tail 200 pascal-editor || true; echo 'Pascal did not become ready within six minutes.' >&2; exit 1; }
          echo 'PASCAL_EDITOR_READY=true'

      - name: Start official Pascal MCP server against the same database
        shell: bash
        run: |
          set -Eeuo pipefail

          MCP_LOG="$RUNNER_TEMP/pascal-mcp.log"
          MCP_PID_FILE="$RUNNER_TEMP/pascal-mcp.pid"

          export PASCAL_DATA_DIR="$GITHUB_WORKSPACE/pascal-data"
          export PASCAL_MCP_HTTP_TOKEN

          nohup bunx --yes --package @pascal-app/mcp pascal-mcp \
            --http \
            --host 0.0.0.0 \
            --port 8787 \
            > "$MCP_LOG" 2>&1 < /dev/null &

          echo "$!" > "$MCP_PID_FILE"

          READY=0
          for attempt in $(seq 1 90); do
            if ! kill -0 "$(cat "$MCP_PID_FILE")" 2>/dev/null; then
              cat "$MCP_LOG" || true
              echo 'Pascal MCP process exited during startup.' >&2
              exit 1
            fi
            if grep -Eqi '8787|listening|http server|ready' "$MCP_LOG"; then
              READY=1
              break
            fi
            sleep 2
          done

          if [[ "$READY" != '1' ]]; then
            cat "$MCP_LOG" || true
            echo 'Pascal MCP did not report readiness.' >&2
            exit 1
          fi

          echo 'PASCAL_MCP_PROCESS_READY=true'

      - name: Publish connection details
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo '## Pascal endpoints'
            echo
            echo "**3D Editor:** $PASCAL_PUBLIC_URL"
            echo
            echo "**MCP endpoint:** $PASCAL_MCP_PUBLIC_URL"
            echo
            echo "**Scene API:** $PASCAL_PUBLIC_URL/api/scenes"
            echo
            printf '**Pascal image:** `%s`\n\n' "$PASCAL_IMAGE"
            echo
            echo 'Use the editor Plugins panel to enable the first-party plugins for each project. Use the browser editor export controls for renderer-backed GLB, USDZ, STL, OBJ, IFC4 and PDF exports. The headless MCP export_glb operation is not the browser exporter.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep Pascal, MCP and both tunnels alive
        if: ${{ inputs.keep_running }}
        shell: bash
        run: |
          set -Eeuo pipefail

          EDITOR_TUNNEL_PID="$(cat "$RUNNER_TEMP/pascal-editor-tunnel.pid")"
          MCP_TUNNEL_PID="$(cat "$RUNNER_TEMP/pascal-mcp-tunnel.pid")"
          MCP_PID="$(cat "$RUNNER_TEMP/pascal-mcp.pid")"

          echo 'Pascal is ready. The workflow remains active until cancelled or the 6-hour Actions limit is reached.'
          while true; do
            [[ "$(docker inspect -f '{{.State.Running}}' pascal-editor 2>/dev/null || echo false)" == 'true' ]] || { docker logs --tail 200 pascal-editor || true; echo 'Pascal Editor stopped.' >&2; exit 1; }
            kill -0 "$MCP_PID" 2>/dev/null || { cat "$RUNNER_TEMP/pascal-mcp.log" || true; echo 'Pascal MCP stopped.' >&2; exit 1; }
            kill -0 "$EDITOR_TUNNEL_PID" 2>/dev/null || { cat "$RUNNER_TEMP/pascal-editor-tunnel.log" || true; echo 'Editor tunnel stopped.' >&2; exit 1; }
            kill -0 "$MCP_TUNNEL_PID" 2>/dev/null || { cat "$RUNNER_TEMP/pascal-mcp-tunnel.log" || true; echo 'MCP tunnel stopped.' >&2; exit 1; }
            sleep 20
          done

      - name: Stop Pascal services cleanly
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          if [[ -f "$RUNNER_TEMP/pascal-mcp.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/pascal-mcp.pid")" >/dev/null 2>&1 || true
          fi
          docker stop --time 30 pascal-editor >/dev/null 2>&1 || true
          docker rm pascal-editor >/dev/null 2>&1 || true
          for file in "$RUNNER_TEMP/pascal-editor-tunnel.pid" "$RUNNER_TEMP/pascal-mcp-tunnel.pid"; do
            [[ -f "$file" ]] && kill "$(cat "$file")" >/dev/null 2>&1 || true
          done

      - name: Save Pascal project database
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: pascal-data
          key: pascal-data-${{ github.ref_name }}-${{ github.run_id }}
