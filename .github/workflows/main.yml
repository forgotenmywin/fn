
name: Pascal Editor MCP - NO AUTH TEST

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pascal-no-auth-test
  cancel-in-progress: true

jobs:
  pascal:
    name: Pascal Editor and Public MCP
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ==========================================
      # 1. Environment
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - name: Check environment
        shell: bash
        run: |
          set -Eeuo pipefail

          node --version
          npm --version
          docker version

          echo "NO AUTHENTICATION MODE"
          echo "No GitHub secrets required."

      # ==========================================
      # 2. Shared storage
      # ==========================================

      - name: Prepare Pascal storage
        shell: bash
        run: |
          set -Eeuo pipefail

          DATA_DIR="${RUNNER_TEMP}/pascal-data"

          mkdir -p "$DATA_DIR"

          echo "PASCAL_DATA_DIR=$DATA_DIR" >> "$GITHUB_ENV"

          echo "Shared Pascal storage prepared."

      # ==========================================
      # 3. Install Cloudflare
      # ==========================================

      - name: Download Cloudflare
        shell: bash
        run: |
          set -Eeuo pipefail

          CF_BIN="${RUNNER_TEMP}/cloudflared"

          curl -fsSL \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" \
            -o "$CF_BIN"

          chmod +x "$CF_BIN"

          "$CF_BIN" --version

          echo "CLOUDFLARED_PATH=$CF_BIN" >> "$GITHUB_ENV"

      # ==========================================
      # 4. Start Editor tunnel
      # ==========================================

      - name: Start Editor tunnel
        shell: bash
        run: |
          set -Eeuo pipefail

          LOG="${RUNNER_TEMP}/editor-tunnel.log"

          nohup "$CLOUDFLARED_PATH" tunnel \
            --url http://127.0.0.1:3000 \
            --no-autoupdate \
            --protocol http2 \
            --loglevel info \
            > "$LOG" 2>&1 < /dev/null &

          PID=$!

          echo "EDITOR_TUNNEL_PID=$PID" >> "$GITHUB_ENV"

          EDITOR_URL=""

          for i in $(seq 1 90); do

            EDITOR_URL=$(
              grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
                "$LOG" | head -n 1 || true
            )

            if [[ -n "$EDITOR_URL" ]]; then
              break
            fi

            kill -0 "$PID" 2>/dev/null || {
              cat "$LOG"
              exit 1
            }

            sleep 2
          done

          if [[ -z "$EDITOR_URL" ]]; then
            cat "$LOG"
            exit 1
          fi

          echo "PASCAL_EDITOR_URL=$EDITOR_URL" >> "$GITHUB_ENV"

          echo "EDITOR URL: $EDITOR_URL"

      # ==========================================
      # 5. Start Editor without password
      # ==========================================

      - name: Start Pascal Editor
        shell: bash
        run: |
          set -Eeuo pipefail

          docker pull ghcr.io/pascalorg/pascal-editor:latest

          docker rm -f pascal-editor 2>/dev/null || true

          docker run -d \
            --name pascal-editor \
            --publish 127.0.0.1:3000:3000 \
            --env NODE_ENV=production \
            --env PASCAL_DATA_DIR=/data \
            --env PASCAL_AUTH=proxy \
            --env "PASCAL_PUBLIC_URL=$PASCAL_EDITOR_URL" \
            --volume "$PASCAL_DATA_DIR:/data" \
            ghcr.io/pascalorg/pascal-editor:latest

          READY=false

          for i in $(seq 1 60); do

            STATUS=$(
              curl -sS \
                --connect-timeout 3 \
                --max-time 10 \
                -o /tmp/pascal-health.txt \
                -w "%{http_code}" \
                http://127.0.0.1:3000/api/health \
                2>/dev/null || true
            )

            echo "Editor health: HTTP $STATUS"

            if [[ "$STATUS" == "200" ]]; then
              READY=true
              break
            fi

            if ! docker inspect pascal-editor \
              --format '{{.State.Running}}' | grep -q true; then

              docker logs --tail 120 pascal-editor || true
              exit 1
            fi

            sleep 3
          done

          if [[ "$READY" != "true" ]]; then
            docker logs --tail 150 pascal-editor || true
            exit 1
          fi

          echo "PASCAL_EDITOR_STATUS=SUCCESS" >> "$GITHUB_ENV"

          echo "PASCAL EDITOR READY"

      # ==========================================
      # 6. Start MCP WITHOUT authentication
      # ==========================================

      - name: Start Pascal MCP without token
        shell: bash
        run: |
          set -Eeuo pipefail

          LOG="${RUNNER_TEMP}/pascal-mcp.log"

          echo "Starting MCP without Bearer authentication."

          # Explicitly remove any inherited token.
          # Host defaults to 127.0.0.1.
          # This permits loopback HTTP without a token.

          nohup env \
            -u PASCAL_MCP_HTTP_TOKEN \
            "PASCAL_DATA_DIR=$PASCAL_DATA_DIR" \
            npm exec --yes --package=@pascal-app/mcp -- \
              pascal-mcp \
              --http \
              --host 127.0.0.1 \
              --port 8787 \
              --cors-origin https://chatgpt.com \
              --cors-origin https://chat.openai.com \
            > "$LOG" 2>&1 < /dev/null &

          PID=$!

          echo "PASCAL_MCP_PID=$PID" >> "$GITHUB_ENV"

          READY=false

          for i in $(seq 1 60); do

            if ! kill -0 "$PID" 2>/dev/null; then
              cat "$LOG"
              exit 1
            fi

            STATUS=$(
              curl -sS \
                --connect-timeout 3 \
                --max-time 10 \
                -o /dev/null \
                -w "%{http_code}" \
                http://127.0.0.1:8787/mcp \
                2>/dev/null || true
            )

            echo "Local MCP listener: HTTP $STATUS"

            # GET /mcp without a session should return 405.
            if [[ "$STATUS" == "405" ]]; then
              READY=true
              break
            fi

            sleep 2
          done

          if [[ "$READY" != "true" ]]; then
            cat "$LOG"
            exit 1
          fi

          echo "PASCAL_MCP_STATUS=READY" >> "$GITHUB_ENV"

          echo "MCP LISTENER READY - NO TOKEN"

      # ==========================================
      # 7. Start public MCP tunnel
      # ==========================================

      - name: Start public MCP tunnel
        shell: bash
        run: |
          set -Eeuo pipefail

          LOG="${RUNNER_TEMP}/mcp-tunnel.log"

          nohup "$CLOUDFLARED_PATH" tunnel \
            --url http://127.0.0.1:8787 \
            --http-host-header 127.0.0.1:8787 \
            --no-autoupdate \
            --protocol http2 \
            --loglevel info \
            > "$LOG" 2>&1 < /dev/null &

          PID=$!

          echo "MCP_TUNNEL_PID=$PID" >> "$GITHUB_ENV"

          MCP_HOST=""

          for i in $(seq 1 90); do

            MCP_HOST=$(
              grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
                "$LOG" | head -n 1 || true
            )

            if [[ -n "$MCP_HOST" ]]; then
              break
            fi

            kill -0 "$PID" 2>/dev/null || {
              cat "$LOG"
              exit 1
            }

            sleep 2
          done

          if [[ -z "$MCP_HOST" ]]; then
            cat "$LOG"
            exit 1
          fi

          MCP_URL="${MCP_HOST}/mcp"

          echo "PASCAL_MCP_HOST=$MCP_HOST" >> "$GITHUB_ENV"
          echo "PASCAL_MCP_URL=$MCP_URL" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "PUBLIC EDITOR:"
          echo "$PASCAL_EDITOR_URL"
          echo ""
          echo "PUBLIC MCP:"
          echo "$MCP_URL"
          echo "AUTHENTICATION: NONE"
          echo "=========================================="

      # ==========================================
      # 8. MCP initialize and tools/list tests
      # ==========================================

      - name: Test MCP without authentication
        shell: bash
        run: |
          set -uo pipefail

          REQUEST="${RUNNER_TEMP}/mcp-request.json"
          HEADERS="${RUNNER_TEMP}/mcp-headers.txt"
          RESPONSE="${RUNNER_TEMP}/mcp-response.txt"
          CURL_ERROR="${RUNNER_TEMP}/mcp-curl-error.txt"

          cat > "$REQUEST" <<'JSON'
          {
            "jsonrpc": "2.0",
            "id": 1,
            "method": "initialize",
            "params": {
              "protocolVersion": "2025-03-26",
              "capabilities": {},
              "clientInfo": {
                "name": "chatgpt-no-auth-test",
                "version": "1.0.0"
              }
            }
          }
          JSON

          mcp_test() {
            ENDPOINT="$1"
            LABEL="$2"

            echo ""
            echo "=========================================="
            echo "TEST: $LABEL"
            echo "$ENDPOINT"
            echo "AUTHENTICATION: NONE"
            echo "=========================================="

            STATUS="000"

            for i in $(seq 1 20); do

              STATUS=$(
                curl -sS \
                  --connect-timeout 10 \
                  --max-time 40 \
                  -D "$HEADERS" \
                  -o "$RESPONSE" \
                  -w "%{http_code}" \
                  -X POST "$ENDPOINT" \
                  -H "Origin: https://chatgpt.com" \
                  -H "Accept: application/json, text/event-stream" \
                  -H "Content-Type: application/json" \
                  --data-binary "@$REQUEST" \
                  2>"$CURL_ERROR" || true
              )

              echo "$LABEL initialize attempt $i: HTTP $STATUS"

              if [[ "$STATUS" == "200" ]]; then
                break
              fi

              sleep 3
            done

            if [[ "$STATUS" != "200" ]]; then
              echo "INITIALIZE FAILED"

              echo "Headers:"
              cat "$HEADERS" || true

              echo "Response:"
              cat "$RESPONSE" || true

              echo "Curl error:"
              cat "$CURL_ERROR" || true

              return 1
            fi

            SESSION_ID=$(
              awk 'tolower($1) == "mcp-session-id:" {
                gsub("\r", "", $2);
                print $2
              }' "$HEADERS" | tail -n 1
            )

            if [[ -z "$SESSION_ID" ]]; then
              echo "MCP session ID missing."
              cat "$RESPONSE" || true
              return 1
            fi

            echo "$LABEL INITIALIZE SUCCESS"
            echo "Session received."

            # Send initialization notification.

            curl -sS \
              --connect-timeout 10 \
              --max-time 30 \
              -o /dev/null \
              -X POST "$ENDPOINT" \
              -H "Origin: https://chatgpt.com" \
              -H "Mcp-Session-Id: $SESSION_ID" \
              -H "MCP-Protocol-Version: 2025-03-26" \
              -H "Accept: application/json, text/event-stream" \
              -H "Content-Type: application/json" \
              --data '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              || true

            # Retrieve the real tool catalog.

            TOOLS_STATUS=$(
              curl -sS \
                --connect-timeout 10 \
                --max-time 40 \
                -o "$RESPONSE" \
                -w "%{http_code}" \
                -X POST "$ENDPOINT" \
                -H "Origin: https://chatgpt.com" \
                -H "Mcp-Session-Id: $SESSION_ID" \
                -H "MCP-Protocol-Version: 2025-03-26" \
                -H "Accept: application/json, text/event-stream" \
                -H "Content-Type: application/json" \
                --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
                || true
            )

            echo "$LABEL tools/list: HTTP $TOOLS_STATUS"

            if [[ "$TOOLS_STATUS" != "200" ]] || ! grep -q '"tools"' "$RESPONSE"; then
              cat "$RESPONSE" || true
              return 1
            fi

            echo ""
            echo "$LABEL AVAILABLE TOOLS:"

            grep -Eo '"name"[[:space:]]*:[[:space:]]*"[^"]+"' \
              "$RESPONSE" | head -n 80 || true

            echo ""
            echo "$LABEL MCP SUCCESS"

            return 0
          }

          LOCAL_RESULT=0
          PUBLIC_RESULT=0

          mcp_test \
            "http://127.0.0.1:8787/mcp" \
            "LOCAL" || LOCAL_RESULT=$?

          mcp_test \
            "$PASCAL_MCP_URL" \
            "PUBLIC" || PUBLIC_RESULT=$?

          if [[ "$LOCAL_RESULT" -eq 0 ]]; then
            echo "PASCAL_LOCAL_VERIFY=SUCCESS" >> "$GITHUB_ENV"
          else
            echo "PASCAL_LOCAL_VERIFY=FAILED" >> "$GITHUB_ENV"
          fi

          if [[ "$PUBLIC_RESULT" -eq 0 ]]; then
            echo "PASCAL_PUBLIC_VERIFY=SUCCESS" >> "$GITHUB_ENV"
          else
            echo "PASCAL_PUBLIC_VERIFY=FAILED" >> "$GITHUB_ENV"
          fi

          echo ""
          echo "=========================================="
          echo "LOCAL RESULT: $LOCAL_RESULT"
          echo "PUBLIC RESULT: $PUBLIC_RESULT"
          echo "=========================================="

      # ==========================================
      # 9. Publish links
      # ==========================================

      - name: Publish links
        if: always()
        shell: bash
        run: |
          {
            echo "# Pascal - No Authentication Test"
            echo ""
            echo "## Editor"
            echo ""
            echo "${PASCAL_EDITOR_URL:-NOT_CREATED}"
            echo ""
            echo "## MCP"
            echo ""
            echo "${PASCAL_MCP_URL:-NOT_CREATED}"
            echo ""
            echo "## Authentication"
            echo ""
            echo "NONE - no Bearer token or password"
            echo ""
            echo "## Verification"
            echo ""
            echo "- Editor: ${PASCAL_EDITOR_STATUS:-UNKNOWN}"
            echo "- MCP: ${PASCAL_MCP_STATUS:-UNKNOWN}"
            echo "- Local: ${PASCAL_LOCAL_VERIFY:-UNKNOWN}"
            echo "- Public: ${PASCAL_PUBLIC_VERIFY:-UNKNOWN}"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "EDITOR: ${PASCAL_EDITOR_URL:-NOT_CREATED}"
          echo "MCP: ${PASCAL_MCP_URL:-NOT_CREATED}"
          echo "LOCAL: ${PASCAL_LOCAL_VERIFY:-UNKNOWN}"
          echo "PUBLIC: ${PASCAL_PUBLIC_VERIFY:-UNKNOWN}"

      # ==========================================
      # 10. Keep services alive
      # ==========================================

      - name: Keep Pascal running
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Pascal is running without passwords."

          while true; do

            echo ""
            echo "Heartbeat: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

            if ! docker inspect pascal-editor \
              --format '{{.State.Running}}' | grep -q true; then

              docker logs --tail 100 pascal-editor || true
              exit 1
            fi

            for PID in \
              "$EDITOR_TUNNEL_PID" \
              "$MCP_TUNNEL_PID" \
              "$PASCAL_MCP_PID"; do

              if ! kill -0 "$PID" 2>/dev/null; then
                echo "Process stopped: $PID"
                exit 1
              fi

            done

            echo "Editor: RUNNING"
            echo "MCP: RUNNING"
            echo "Cloudflare: RUNNING"

            sleep 30
          done
