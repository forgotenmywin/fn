
name: Pascal Editor and MCP - Docker Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pascal-editor-mcp
  cancel-in-progress: true

jobs:
  pascal:
    name: Pascal Editor and MCP
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ==========================================
      # 1. Environment
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - name: Validate secrets
        shell: bash
        env:
          PASCAL_ADMIN_PASSWORD: ${{ secrets.PASCAL_ADMIN_PASSWORD }}
          PASCAL_MCP_HTTP_TOKEN: ${{ secrets.PASCAL_MCP_HTTP_TOKEN }}
        run: |
          set -Eeuo pipefail

          [[ -n "$PASCAL_ADMIN_PASSWORD" ]] || {
            echo "Missing PASCAL_ADMIN_PASSWORD"
            exit 1
          }

          [[ -n "$PASCAL_MCP_HTTP_TOKEN" ]] || {
            echo "Missing PASCAL_MCP_HTTP_TOKEN"
            exit 1
          }

          node --version
          npm --version
          docker version

          echo "Secrets configured."

      # ==========================================
      # 2. Shared storage
      # ==========================================

      - name: Prepare Pascal storage
        shell: bash
        run: |
          set -Eeuo pipefail

          DATA_DIR="${RUNNER_TEMP}/pascal-data"

          mkdir -p "$DATA_DIR"

          echo "PASCAL_DATA_DIR=$DATA_DIR" >> "$GITHUB_ENV"

          echo "Pascal data directory prepared."

      # ==========================================
      # 3. Cloudflare tunnels
      # ==========================================

      - name: Start Cloudflare Quick Tunnels
        shell: bash
        run: |
          set -Eeuo pipefail

          CF_BIN="${RUNNER_TEMP}/cloudflared"

          EDITOR_LOG="${RUNNER_TEMP}/cloudflare-editor.log"
          MCP_LOG="${RUNNER_TEMP}/cloudflare-mcp.log"

          curl -fsSL \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" \
            -o "$CF_BIN"

          chmod +x "$CF_BIN"

          "$CF_BIN" --version

          nohup "$CF_BIN" tunnel \
            --url http://127.0.0.1:3000 \
            --no-autoupdate \
            --protocol http2 \
            --loglevel info \
            > "$EDITOR_LOG" 2>&1 < /dev/null &

          EDITOR_PID=$!

          nohup "$CF_BIN" tunnel \
            --url http://127.0.0.1:8787 \
            --no-autoupdate \
            --protocol http2 \
            --loglevel info \
            > "$MCP_LOG" 2>&1 < /dev/null &

          MCP_TUNNEL_PID=$!

          echo "EDITOR_TUNNEL_PID=$EDITOR_PID" >> "$GITHUB_ENV"
          echo "MCP_TUNNEL_PID=$MCP_TUNNEL_PID" >> "$GITHUB_ENV"

          EDITOR_URL=""
          MCP_HOST=""

          for i in $(seq 1 90); do

            EDITOR_URL=$(
              grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
                "$EDITOR_LOG" | head -n 1 || true
            )

            MCP_HOST=$(
              grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
                "$MCP_LOG" | head -n 1 || true
            )

            if [[ -n "$EDITOR_URL" && -n "$MCP_HOST" ]]; then
              break
            fi

            kill -0 "$EDITOR_PID" 2>/dev/null || {
              cat "$EDITOR_LOG"
              exit 1
            }

            kill -0 "$MCP_TUNNEL_PID" 2>/dev/null || {
              cat "$MCP_LOG"
              exit 1
            }

            sleep 2
          done

          if [[ -z "$EDITOR_URL" || -z "$MCP_HOST" ]]; then
            echo "Could not obtain both Cloudflare URLs."

            tail -n 100 "$EDITOR_LOG" || true
            tail -n 100 "$MCP_LOG" || true

            exit 1
          fi

          MCP_URL="${MCP_HOST}/mcp"

          {
            echo "PASCAL_EDITOR_URL=$EDITOR_URL"
            echo "PASCAL_MCP_HOST=$MCP_HOST"
            echo "PASCAL_MCP_URL=$MCP_URL"
          } >> "$GITHUB_ENV"

          echo "=========================================="
          echo "EDITOR: $EDITOR_URL"
          echo "MCP:    $MCP_URL"
          echo "=========================================="

      # ==========================================
      # 4. Pascal Editor Docker
      # ==========================================

      - name: Start Pascal Editor
        shell: bash
        env:
          PASCAL_ADMIN_PASSWORD: ${{ secrets.PASCAL_ADMIN_PASSWORD }}
        run: |
          set -Eeuo pipefail

          docker pull ghcr.io/pascalorg/pascal-editor:latest

          docker rm -f pascal-editor 2>/dev/null || true

          docker run -d \
            --name pascal-editor \
            --restart unless-stopped \
            --publish 3000:3000 \
            --env NODE_ENV=production \
            --env PASCAL_DATA_DIR=/data \
            --env "PASCAL_ADMIN_PASSWORD=$PASCAL_ADMIN_PASSWORD" \
            --env "PASCAL_PUBLIC_URL=$PASCAL_EDITOR_URL" \
            --volume "$PASCAL_DATA_DIR:/data" \
            ghcr.io/pascalorg/pascal-editor:latest

          echo "Waiting for Pascal Editor..."

          READY=false

          for i in $(seq 1 60); do

            if ! docker inspect pascal-editor \
              --format '{{.State.Running}}' | grep -q true; then

              docker logs --tail 120 pascal-editor || true

              echo "Pascal container stopped."
              exit 1
            fi

            STATUS=$(
              curl -sS \
                --connect-timeout 3 \
                --max-time 10 \
                -o /tmp/pascal-health.txt \
                -w "%{http_code}" \
                http://127.0.0.1:3000/api/health \
                2>/dev/null || true
            )

            if [[ "$STATUS" == "200" ]]; then
              READY=true
              break
            fi

            echo "Editor health: HTTP $STATUS"
            sleep 3
          done

          if [[ "$READY" != "true" ]]; then
            docker logs --tail 150 pascal-editor || true
            exit 1
          fi

          echo "PASCAL_EDITOR_STATUS=SUCCESS" >> "$GITHUB_ENV"

          echo "PASCAL EDITOR READY"

      # ==========================================
      # 5. Start official MCP
      # ==========================================

      - name: Start Pascal MCP HTTP server
        shell: bash
        env:
          PASCAL_MCP_HTTP_TOKEN: ${{ secrets.PASCAL_MCP_HTTP_TOKEN }}
        run: |
          set -Eeuo pipefail

          MCP_LOG="${RUNNER_TEMP}/pascal-mcp.log"
          MCP_ERROR="${RUNNER_TEMP}/pascal-mcp-error.log"

          echo "Starting Pascal MCP..."

          # Important:
          # --cors-origin is the official origin allowlist option.
          # The previous PASCAL_MCP_HTTP_ORIGINS variable was not
          # the documented configuration for this server.

          nohup env \
            "PASCAL_DATA_DIR=$PASCAL_DATA_DIR" \
            "PASCAL_MCP_HTTP_TOKEN=$PASCAL_MCP_HTTP_TOKEN" \
            npm exec --yes --package=@pascal-app/mcp -- \
              pascal-mcp \
              --http \
              --host 0.0.0.0 \
              --port 8787 \
              --cors-origin https://chatgpt.com \
              --cors-origin https://chat.openai.com \
            > "$MCP_LOG" 2>"$MCP_ERROR" < /dev/null &

          MCP_PID=$!

          echo "PASCAL_MCP_PID=$MCP_PID" >> "$GITHUB_ENV"

          READY=false

          for i in $(seq 1 60); do

            if ! kill -0 "$MCP_PID" 2>/dev/null; then
              echo "MCP process exited."

              tail -n 150 "$MCP_LOG" || true
              tail -n 150 "$MCP_ERROR" || true

              exit 1
            fi

            STATUS=$(
              curl -sS \
                --connect-timeout 3 \
                --max-time 10 \
                -o /dev/null \
                -w "%{http_code}" \
                -H "Authorization: Bearer $PASCAL_MCP_HTTP_TOKEN" \
                http://127.0.0.1:8787/mcp \
                2>/dev/null || true
            )

            if [[ "$STATUS" == "405" ]]; then
              READY=true
              break
            fi

            echo "Waiting for MCP listener: HTTP $STATUS"
            sleep 2
          done

          if [[ "$READY" != "true" ]]; then
            tail -n 150 "$MCP_LOG" || true
            tail -n 150 "$MCP_ERROR" || true

            exit 1
          fi

          echo "PASCAL_MCP_STATUS=READY" >> "$GITHUB_ENV"

          echo "MCP HTTP LISTENER READY"

      # ==========================================
      # 6. Verify local and public MCP
      # ==========================================

      - name: Test MCP initialize and tools list
        shell: bash
        env:
          PASCAL_MCP_HTTP_TOKEN: ${{ secrets.PASCAL_MCP_HTTP_TOKEN }}
        run: |
          set -Eeuo pipefail

          REQUEST="${RUNNER_TEMP}/mcp-request.json"
          RESPONSE="${RUNNER_TEMP}/mcp-response.txt"
          HEADERS="${RUNNER_TEMP}/mcp-headers.txt"
          CURL_ERROR="${RUNNER_TEMP}/mcp-curl-error.txt"

          cat > "$REQUEST" <<'JSON'
          {
            "jsonrpc": "2.0",
            "id": 1,
            "method": "initialize",
            "params": {
              "protocolVersion": "2025-03-26",
              "capabilities": {},
              "clientInfo": {
                "name": "github-actions-pascal",
                "version": "1.0.0"
              }
            }
          }
          JSON

          mcp_test() {
            local ENDPOINT="$1"
            local LABEL="$2"

            local STATUS=""
            local SESSION_ID=""
            local TOOLS_STATUS=""
            local INITIALIZED_STATUS=""

            echo ""
            echo "=========================================="
            echo "TESTING $LABEL"
            echo "ENDPOINT: $ENDPOINT"
            echo "=========================================="

            local INITIALIZED=false

            for attempt in $(seq 1 20); do

              STATUS=$(
                curl -sS \
                  --connect-timeout 10 \
                  --max-time 40 \
                  -D "$HEADERS" \
                  -o "$RESPONSE" \
                  -w "%{http_code}" \
                  -X POST "$ENDPOINT" \
                  -H "Authorization: Bearer $PASCAL_MCP_HTTP_TOKEN" \
                  -H "Origin: https://chatgpt.com" \
                  -H "Accept: application/json, text/event-stream" \
                  -H "Content-Type: application/json" \
                  --data-binary "@$REQUEST" \
                  2>"$CURL_ERROR" || true
              )

              echo "$LABEL initialize: HTTP $STATUS"

              if [[ "$STATUS" == "200" ]]; then
                INITIALIZED=true
                break
              fi

              sleep 3
            done

            if [[ "$INITIALIZED" != "true" ]]; then
              echo "$LABEL INITIALIZE FAILED"

              echo "Response headers:"
              cat "$HEADERS" || true

              echo "Response body:"
              cat "$RESPONSE" || true

              echo "Curl error:"
              cat "$CURL_ERROR" || true

              return 1
            fi

            SESSION_ID=$(
              awk 'tolower($1) == "mcp-session-id:" {
                gsub("\r", "", $2);
                print $2
              }' "$HEADERS" | tail -n 1
            )

            echo "$LABEL initialize succeeded."

            # Build session header only when server provides one.
            SESSION_ARGS=()

            if [[ -n "$SESSION_ID" ]]; then
              SESSION_ARGS+=(-H "Mcp-Session-Id: $SESSION_ID")
              echo "$LABEL session ID received."
            else
              echo "$LABEL server did not issue a session ID."
            fi

            INITIALIZED_STATUS=$(
              curl -sS \
                --connect-timeout 10 \
                --max-time 30 \
                -o /dev/null \
                -w "%{http_code}" \
                -X POST "$ENDPOINT" \
                -H "Authorization: Bearer $PASCAL_MCP_HTTP_TOKEN" \
                -H "Origin: https://chatgpt.com" \
                -H "MCP-Protocol-Version: 2025-03-26" \
                -H "Accept: application/json, text/event-stream" \
                -H "Content-Type: application/json" \
                "${SESSION_ARGS[@]}" \
                --data '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
                || true
            )

            echo "$LABEL initialized notification: HTTP $INITIALIZED_STATUS"

            TOOLS_STATUS=$(
              curl -sS \
                --connect-timeout 10 \
                --max-time 40 \
                -o "$RESPONSE" \
                -w "%{http_code}" \
                -X POST "$ENDPOINT" \
                -H "Authorization: Bearer $PASCAL_MCP_HTTP_TOKEN" \
                -H "Origin: https://chatgpt.com" \
                -H "MCP-Protocol-Version: 2025-03-26" \
                -H "Accept: application/json, text/event-stream" \
                -H "Content-Type: application/json" \
                "${SESSION_ARGS[@]}" \
                --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
                || true
            )

            echo "$LABEL tools/list: HTTP $TOOLS_STATUS"

            if [[ "$TOOLS_STATUS" != "200" ]] || ! grep -q '"tools"' "$RESPONSE"; then
              echo "tools/list response:"
              cat "$RESPONSE" || true
              return 1
            fi

            echo ""
            echo "$LABEL AVAILABLE TOOLS:"

            grep -Eo '"name"[[:space:]]*:[[:space:]]*"[^"]+"' \
              "$RESPONSE" | head -n 60 || true

            echo ""
            echo "$LABEL MCP SUCCESS"

            return 0
          }

          set +e

          # Local endpoint: full endpoint URL, no duplicate path.
          mcp_test "http://127.0.0.1:8787/mcp" "LOCAL"
          LOCAL_RESULT=$?

          # Public URL already ends with /mcp.
          # Do not append another /mcp here.
          mcp_test "$PASCAL_MCP_URL" "PUBLIC"
          PUBLIC_RESULT=$?

          set -e

          if [[ "$LOCAL_RESULT" -eq 0 ]]; then
            echo "PASCAL_LOCAL_VERIFY=SUCCESS" >> "$GITHUB_ENV"
          else
            echo "PASCAL_LOCAL_VERIFY=FAILED" >> "$GITHUB_ENV"
          fi

          if [[ "$PUBLIC_RESULT" -eq 0 ]]; then
            echo "PASCAL_PUBLIC_VERIFY=SUCCESS" >> "$GITHUB_ENV"
          else
            echo "PASCAL_PUBLIC_VERIFY=FAILED" >> "$GITHUB_ENV"
          fi

          echo ""
          echo "=========================================="
          echo "LOCAL RESULT: $LOCAL_RESULT"
          echo "PUBLIC RESULT: $PUBLIC_RESULT"
          echo "=========================================="

          if [[ "$LOCAL_RESULT" -ne 0 ]]; then
            echo "Local MCP failed. Check Origin, token and MCP logs."
          fi

          if [[ "$PUBLIC_RESULT" -ne 0 ]]; then
            echo "Public MCP failed. Check Cloudflare and MCP logs."
          fi

      # ==========================================
      # 7. Final diagnostics
      # ==========================================

      - name: Print diagnostics
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "PASCAL STATUS"
          echo "=========================================="

          echo "Editor: ${PASCAL_EDITOR_STATUS:-UNKNOWN}"
          echo "MCP: ${PASCAL_MCP_STATUS:-UNKNOWN}"
          echo "Local test: ${PASCAL_LOCAL_VERIFY:-UNKNOWN}"
          echo "Public test: ${PASCAL_PUBLIC_VERIFY:-UNKNOWN}"

          echo ""
          echo "Editor URL:"
          echo "${PASCAL_EDITOR_URL:-NOT_CREATED}"

          echo ""
          echo "MCP URL:"
          echo "${PASCAL_MCP_URL:-NOT_CREATED}"

          echo ""
          echo "MCP SERVER LOG:"
          tail -n 100 "${RUNNER_TEMP}/pascal-mcp.log" 2>/dev/null || true

          echo ""
          echo "MCP ERROR LOG:"
          tail -n 100 "${RUNNER_TEMP}/pascal-mcp-error.log" 2>/dev/null || true

          echo ""
          echo "CLOUDFLARE MCP LOG:"
          tail -n 80 "${RUNNER_TEMP}/cloudflare-mcp.log" 2>/dev/null || true

      # ==========================================
      # 8. GitHub Summary
      # ==========================================

      - name: Publish connection links
        if: always()
        shell: bash
        run: |
          {
            echo "# Pascal Editor and MCP"
            echo ""
            echo "## Editor"
            echo ""
            echo "${PASCAL_EDITOR_URL:-NOT_CREATED}"
            echo ""
            echo "## MCP endpoint"
            echo ""
            echo "${PASCAL_MCP_URL:-NOT_CREATED}"
            echo ""
            echo "## Verification"
            echo ""
            echo "- Editor: ${PASCAL_EDITOR_STATUS:-UNKNOWN}"
            echo "- MCP: ${PASCAL_MCP_STATUS:-UNKNOWN}"
            echo "- Local: ${PASCAL_LOCAL_VERIFY:-UNKNOWN}"
            echo "- Public: ${PASCAL_PUBLIC_VERIFY:-UNKNOWN}"
            echo ""
            echo "## Authentication"
            echo ""
            echo "- Editor: PASCAL_ADMIN_PASSWORD"
            echo "- MCP: Bearer token PASCAL_MCP_HTTP_TOKEN"
          } >> "$GITHUB_STEP_SUMMARY"

      # ==========================================
      # 9. Keep services alive
      # ==========================================

      - name: Keep Pascal and tunnels alive
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Pascal services are running."

          while true; do

            echo ""
            echo "Heartbeat: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

            if ! docker inspect pascal-editor \
              --format '{{.State.Running}}' | grep -q true; then

              echo "Pascal Editor container stopped."
              docker logs --tail 100 pascal-editor || true
              exit 1
            fi

            for PID in \
              "$EDITOR_TUNNEL_PID" \
              "$MCP_TUNNEL_PID" \
              "$PASCAL_MCP_PID"; do

              if ! kill -0 "$PID" 2>/dev/null; then
                echo "Required process stopped: $PID"
                exit 1
              fi

            done

            echo "Editor: RUNNING"
            echo "MCP: RUNNING"
            echo "Cloudflare tunnels: RUNNING"

            sleep 30
          done
