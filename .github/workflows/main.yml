
name: Pascal Editor and MCP - Docker + Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pascal-editor-mcp
  cancel-in-progress: true

jobs:
  pascal:
    name: Start Pascal Editor and MCP
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ==============================================
      # 1. Checkout
      # ==============================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==============================================
      # 2. Install Node.js
      # ==============================================

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      # ==============================================
      # 3. Validate secrets and Docker
      # ==============================================

      - name: Validate environment
        shell: bash
        env:
          PASCAL_ADMIN_PASSWORD: ${{ secrets.PASCAL_ADMIN_PASSWORD }}
          PASCAL_MCP_HTTP_TOKEN: ${{ secrets.PASCAL_MCP_HTTP_TOKEN }}
        run: |
          set -Eeuo pipefail

          if [[ -z "$PASCAL_ADMIN_PASSWORD" ]]; then
            echo "ERROR: Missing PASCAL_ADMIN_PASSWORD secret."
            exit 1
          fi

          if [[ -z "$PASCAL_MCP_HTTP_TOKEN" ]]; then
            echo "ERROR: Missing PASCAL_MCP_HTTP_TOKEN secret."
            exit 1
          fi

          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

          echo "Docker:"
          docker version

          echo "Required secrets: configured"

      # ==============================================
      # 4. Prepare shared Pascal database
      # ==============================================

      - name: Prepare shared Pascal storage
        shell: bash
        run: |
          set -Eeuo pipefail

          DATA_DIR="${RUNNER_TEMP}/pascal-data"

          mkdir -p "$DATA_DIR"

          echo "PASCAL_DATA_DIR=$DATA_DIR" >> "$GITHUB_ENV"

          echo "Pascal data directory:"
          echo "$DATA_DIR"

      # ==============================================
      # 5. Download Cloudflare and start two tunnels
      # ==============================================

      - name: Start Cloudflare Quick Tunnels
        shell: bash
        run: |
          set -Eeuo pipefail

          CF_BIN="${RUNNER_TEMP}/cloudflared"

          EDITOR_LOG="${RUNNER_TEMP}/cloudflare-editor.log"
          MCP_LOG="${RUNNER_TEMP}/cloudflare-mcp.log"

          echo "Downloading Cloudflare..."

          curl -fsSL \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" \
            -o "$CF_BIN"

          chmod +x "$CF_BIN"

          "$CF_BIN" --version

          echo "Starting Pascal Editor tunnel..."

          nohup "$CF_BIN" tunnel \
            --url http://127.0.0.1:3000 \
            --no-autoupdate \
            --protocol http2 \
            --loglevel info \
            > "$EDITOR_LOG" 2>&1 < /dev/null &

          EDITOR_PID=$!

          echo "Starting Pascal MCP tunnel..."

          nohup "$CF_BIN" tunnel \
            --url http://127.0.0.1:8787 \
            --no-autoupdate \
            --protocol http2 \
            --loglevel info \
            > "$MCP_LOG" 2>&1 < /dev/null &

          MCP_TUNNEL_PID=$!

          echo "EDITOR_TUNNEL_PID=$EDITOR_PID" >> "$GITHUB_ENV"
          echo "MCP_TUNNEL_PID=$MCP_TUNNEL_PID" >> "$GITHUB_ENV"

          EDITOR_URL=""
          MCP_HOST=""

          echo "Waiting for Cloudflare URLs..."

          for i in $(seq 1 90); do

            EDITOR_URL=$(
              grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
                "$EDITOR_LOG" | head -n 1 || true
            )

            MCP_HOST=$(
              grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
                "$MCP_LOG" | head -n 1 || true
            )

            if [[ -n "$EDITOR_URL" && -n "$MCP_HOST" ]]; then
              break
            fi

            if ! kill -0 "$EDITOR_PID" 2>/dev/null; then
              echo "Editor tunnel process stopped."
              cat "$EDITOR_LOG"
              exit 1
            fi

            if ! kill -0 "$MCP_TUNNEL_PID" 2>/dev/null; then
              echo "MCP tunnel process stopped."
              cat "$MCP_LOG"
              exit 1
            fi

            sleep 2
          done

          if [[ -z "$EDITOR_URL" || -z "$MCP_HOST" ]]; then
            echo "Cloudflare URL detection failed."

            echo "Editor tunnel log:"
            tail -n 100 "$EDITOR_LOG" || true

            echo "MCP tunnel log:"
            tail -n 100 "$MCP_LOG" || true

            exit 1
          fi

          MCP_URL="${MCP_HOST}/mcp"

          {
            echo "PASCAL_EDITOR_URL=$EDITOR_URL"
            echo "PASCAL_MCP_URL=$MCP_URL"
          } >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "PASCAL EDITOR URL"
          echo "$EDITOR_URL"
          echo ""
          echo "PASCAL MCP URL"
          echo "$MCP_URL"
          echo "=========================================="

      # ==============================================
      # 6. Start official Pascal Docker image
      # ==============================================

      - name: Start Pascal Editor container
        shell: bash
        env:
          PASCAL_ADMIN_PASSWORD: ${{ secrets.PASCAL_ADMIN_PASSWORD }}
        run: |
          set -Eeuo pipefail

          echo "Pulling official Pascal image..."

          docker pull ghcr.io/pascalorg/pascal-editor:latest

          echo "Starting Pascal Editor..."

          docker run -d \
            --name pascal-editor \
            --restart unless-stopped \
            --publish 3000:3000 \
            --env NODE_ENV=production \
            --env PASCAL_DATA_DIR=/data \
            --env "PASCAL_ADMIN_PASSWORD=$PASCAL_ADMIN_PASSWORD" \
            --env "PASCAL_PUBLIC_URL=$PASCAL_EDITOR_URL" \
            --volume "$PASCAL_DATA_DIR:/data" \
            ghcr.io/pascalorg/pascal-editor:latest

          echo "Container started."

          READY=false

          for i in $(seq 1 60); do

            if ! docker inspect pascal-editor \
              --format '{{.State.Running}}' | grep -q true; then

              echo "Pascal container stopped."

              docker logs --tail 120 pascal-editor || true

              exit 1
            fi

            STATUS=$(
              curl -sS \
                --connect-timeout 3 \
                --max-time 10 \
                -o /tmp/pascal-health.json \
                -w "%{http_code}" \
                http://127.0.0.1:3000/api/health \
                || true
            )

            if [[ "$STATUS" == "200" ]]; then
              READY=true
              break
            fi

            echo "Waiting for Pascal Editor: HTTP $STATUS"

            sleep 3
          done

          if [[ "$READY" != "true" ]]; then
            echo "Pascal Editor health check failed."

            docker logs --tail 150 pascal-editor || true

            exit 1
          fi

          echo "PASCAL_EDITOR_STATUS=SUCCESS" >> "$GITHUB_ENV"

          echo "PASCAL EDITOR: READY"

      # ==============================================
      # 7. Start official standalone Pascal MCP
      # ==============================================

      - name: Start Pascal MCP HTTP server
        shell: bash
        env:
          PASCAL_MCP_HTTP_TOKEN: ${{ secrets.PASCAL_MCP_HTTP_TOKEN }}
        run: |
          set -Eeuo pipefail

          MCP_LOG="${RUNNER_TEMP}/pascal-mcp.log"

          echo "Starting official Pascal MCP package..."

          nohup env \
            PASCAL_DATA_DIR="$PASCAL_DATA_DIR" \
            PASCAL_MCP_HTTP_TOKEN="$PASCAL_MCP_HTTP_TOKEN" \
            PASCAL_MCP_HTTP_ORIGINS="https://chatgpt.com,https://chat.openai.com" \
            npm exec --yes --package=@pascal-app/mcp -- \
              pascal-mcp \
              --http \
              --host 0.0.0.0 \
              --port 8787 \
            > "$MCP_LOG" 2>&1 < /dev/null &

          MCP_PID=$!

          echo "PASCAL_MCP_PID=$MCP_PID" >> "$GITHUB_ENV"

          READY=false

          for i in $(seq 1 60); do

            if ! kill -0 "$MCP_PID" 2>/dev/null; then
              echo "MCP process stopped."

              tail -n 150 "$MCP_LOG" || true

              exit 1
            fi

            STATUS=$(
              curl -sS \
                -o /dev/null \
                -w "%{http_code}" \
                -H "Authorization: Bearer $PASCAL_MCP_HTTP_TOKEN" \
                http://127.0.0.1:8787/mcp \
                || true
            )

            if [[ "$STATUS" == "405" ]]; then
              READY=true
              break
            fi

            echo "Waiting for MCP HTTP listener: $STATUS"

            sleep 2
          done

          if [[ "$READY" != "true" ]]; then
            echo "MCP did not become ready."

            tail -n 150 "$MCP_LOG" || true

            exit 1
          fi

          echo "PASCAL_MCP_STATUS=READY" >> "$GITHUB_ENV"

          echo "PASCAL MCP HTTP LISTENER: READY"

      # ==============================================
      # 8. Initialize and test MCP sessions
      # ==============================================

      - name: Verify local and public MCP
        id: verify
        shell: bash
        env:
          PASCAL_MCP_HTTP_TOKEN: ${{ secrets.PASCAL_MCP_HTTP_TOKEN }}
        run: |
          set -Eeuo pipefail

          REQUEST="${RUNNER_TEMP}/mcp-request.json"
          INIT_BODY="${RUNNER_TEMP}/mcp-init-response.txt"
          INIT_HEADERS="${RUNNER_TEMP}/mcp-init-headers.txt"
          TOOLS_BODY="${RUNNER_TEMP}/mcp-tools-response.txt"
          CURL_ERROR="${RUNNER_TEMP}/mcp-curl-error.txt"

          cat > "$REQUEST" <<'JSON'
          {
            "jsonrpc": "2.0",
            "id": 1,
            "method": "initialize",
            "params": {
              "protocolVersion": "2025-03-26",
              "capabilities": {},
              "clientInfo": {
                "name": "github-actions-pascal-test",
                "version": "1.0.0"
              }
            }
          }
          JSON

          mcp_test() {
            local BASE_URL="$1"
            local LABEL="$2"
            local HTTP_STATUS=""
            local SESSION_ID=""
            local NOTIFY_STATUS=""
            local TOOLS_STATUS=""
            local SUCCESS=false

            echo ""
            echo "=========================================="
            echo "Testing $LABEL MCP"
            echo "=========================================="

            for attempt in $(seq 1 25); do

              HTTP_STATUS=$(
                curl -sS \
                  --connect-timeout 10 \
                  --max-time 40 \
                  -D "$INIT_HEADERS" \
                  -o "$INIT_BODY" \
                  -w "%{http_code}" \
                  -X POST "${BASE_URL}/mcp" \
                  -H "Authorization: Bearer $PASCAL_MCP_HTTP_TOKEN" \
                  -H "Origin: https://chatgpt.com" \
                  -H "Accept: application/json, text/event-stream" \
                  -H "Content-Type: application/json" \
                  --data-binary "@$REQUEST" \
                  2>"$CURL_ERROR" || true
              )

              echo "$LABEL initialize attempt $attempt: HTTP $HTTP_STATUS"

              if [[ "$HTTP_STATUS" == "200" ]]; then

                SESSION_ID=$(
                  awk 'tolower($1) == "mcp-session-id:" {
                    gsub("\r", "", $2);
                    print $2
                  }' "$INIT_HEADERS" | tail -n 1
                )

                if [[ -n "$SESSION_ID" ]]; then
                  SUCCESS=true
                  break
                fi

                echo "HTTP 200 but session ID is missing."
              fi

              sleep 4
            done

            if [[ "$SUCCESS" != "true" ]]; then

              echo "$LABEL MCP initialize failed."

              echo "HTTP headers:"
              cat "$INIT_HEADERS" || true

              echo "HTTP body:"
              cat "$INIT_BODY" || true

              echo "Curl error:"
              cat "$CURL_ERROR" || true

              return 1
            fi

            echo "$LABEL session initialized."

            # Send initialized notification.

            NOTIFY_STATUS=$(
              curl -sS \
                --connect-timeout 10 \
                --max-time 30 \
                -o /dev/null \
                -w "%{http_code}" \
                -X POST "${BASE_URL}/mcp" \
                -H "Authorization: Bearer $PASCAL_MCP_HTTP_TOKEN" \
                -H "Origin: https://chatgpt.com" \
                -H "Mcp-Session-Id: $SESSION_ID" \
                -H "MCP-Protocol-Version: 2025-03-26" \
                -H "Accept: application/json, text/event-stream" \
                -H "Content-Type: application/json" \
                --data '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
                || true
            )

            echo "$LABEL initialized notification: HTTP $NOTIFY_STATUS"

            # Request tool catalog.

            TOOLS_STATUS=$(
              curl -sS \
                --connect-timeout 10 \
                --max-time 40 \
                -o "$TOOLS_BODY" \
                -w "%{http_code}" \
                -X POST "${BASE_URL}/mcp" \
                -H "Authorization: Bearer $PASCAL_MCP_HTTP_TOKEN" \
                -H "Origin: https://chatgpt.com" \
                -H "Mcp-Session-Id: $SESSION_ID" \
                -H "MCP-Protocol-Version: 2025-03-26" \
                -H "Accept: application/json, text/event-stream" \
                -H "Content-Type: application/json" \
                --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
                || true
            )

            echo "$LABEL tools/list: HTTP $TOOLS_STATUS"

            if [[ "$TOOLS_STATUS" != "200" ]] || ! grep -q '"tools"' "$TOOLS_BODY"; then

              echo "$LABEL tools/list failed."

              cat "$TOOLS_BODY" || true

              return 1
            fi

            echo ""
            echo "$LABEL MCP TOOLS:"
            grep -Eo '"name"[[:space:]]*:[[:space:]]*"[^"]+"' \
              "$TOOLS_BODY" | head -n 50 || true

            echo ""
            echo "$LABEL MCP: SUCCESS"

            return 0
          }

          set +e

          mcp_test "http://127.0.0.1:8787" "LOCAL"
          LOCAL_RESULT=$?

          mcp_test "$PASCAL_MCP_URL%/mcp" "PUBLIC"
          PUBLIC_RESULT=$?

          set -e

          if [[ "$LOCAL_RESULT" -eq 0 ]]; then
            echo "PASCAL_LOCAL_VERIFY=SUCCESS" >> "$GITHUB_ENV"
            echo "local=SUCCESS" >> "$GITHUB_OUTPUT"
          else
            echo "PASCAL_LOCAL_VERIFY=FAILED" >> "$GITHUB_ENV"
            echo "local=FAILED" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$PUBLIC_RESULT" -eq 0 ]]; then
            echo "PASCAL_PUBLIC_VERIFY=SUCCESS" >> "$GITHUB_ENV"
            echo "public=SUCCESS" >> "$GITHUB_OUTPUT"
          else
            echo "PASCAL_PUBLIC_VERIFY=FAILED" >> "$GITHUB_ENV"
            echo "public=FAILED" >> "$GITHUB_OUTPUT"
          fi

          echo ""
          echo "=========================================="
          echo "LOCAL MCP RESULT: $LOCAL_RESULT"
          echo "PUBLIC MCP RESULT: $PUBLIC_RESULT"
          echo "=========================================="

          echo "Editor and MCP diagnostics completed."

      # ==============================================
      # 9. Publish connection links
      # ==============================================

      - name: Publish connection details
        if: always()
        shell: bash
        run: |
          {
            echo "# Pascal Editor and MCP"
            echo ""
            echo "## Editor"
            echo ""
            echo "$PASCAL_EDITOR_URL"
            echo ""
            echo "## MCP Endpoint"
            echo ""
            echo "$PASCAL_MCP_URL"
            echo ""
            echo "## Status"
            echo ""
            echo "- Editor: ${PASCAL_EDITOR_STATUS:-UNKNOWN}"
            echo "- Local MCP: ${PASCAL_LOCAL_VERIFY:-UNKNOWN}"
            echo "- Public MCP: ${PASCAL_PUBLIC_VERIFY:-UNKNOWN}"
            echo ""
            echo "## Authentication"
            echo ""
            echo "- Editor: GitHub Secret \`PASCAL_ADMIN_PASSWORD\`"
            echo "- MCP: Bearer token from \`PASCAL_MCP_HTTP_TOKEN\`"
            echo ""
            echo "Do not share either secret."
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "=========================================="
          echo "PASCAL EDITOR:"
          echo "${PASCAL_EDITOR_URL:-NOT_CREATED}"
          echo ""
          echo "PASCAL MCP:"
          echo "${PASCAL_MCP_URL:-NOT_CREATED}"
          echo ""
          echo "LOCAL MCP:"
          echo "${PASCAL_LOCAL_VERIFY:-UNKNOWN}"
          echo ""
          echo "PUBLIC MCP:"
          echo "${PASCAL_PUBLIC_VERIFY:-UNKNOWN}"
          echo "=========================================="

      # ==============================================
      # 10. Keep all services alive
      # ==============================================

      - name: Keep Pascal and tunnels alive
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Pascal Editor and MCP are running."

          while true; do

            echo ""
            echo "Heartbeat: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

            if ! docker inspect pascal-editor \
              --format '{{.State.Running}}' | grep -q true; then

              echo "Pascal Editor container stopped."

              docker logs --tail 100 pascal-editor || true

              exit 1
            fi

            for PID in \
              "$EDITOR_TUNNEL_PID" \
              "$MCP_TUNNEL_PID" \
              "$PASCAL_MCP_PID"; do

              if ! kill -0 "$PID" 2>/dev/null; then
                echo "Required process stopped: $PID"
                exit 1
              fi

            done

            echo "Editor container: RUNNING"
            echo "Editor tunnel: RUNNING"
            echo "MCP tunnel: RUNNING"
            echo "MCP process: RUNNING"

            sleep 30

          done
