name: Pascal5 Editor and MCP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pascal5-editor-mcp
  cancel-in-progress: true

jobs:
  pascal:
    name: Start Pascal Editor and MCP
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out the official Pascal Editor
        uses: actions/checkout@v4
        with:
          repository: pascalorg/editor
          ref: main
          path: pascal-editor
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore Pascal project database
        uses: actions/cache@v4
        with:
          path: .pascal-data
          key: pascal-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pascal-data-

      - name: Install Cloudflare Tunnel
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Install Pascal dependencies and build MCP
        working-directory: pascal-editor
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run --cwd packages/mcp build

      - name: Configure Pascal runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.pascal-data"
          EDITOR_PASSWORD="$(python3 - <<'PY'
          import secrets
          print(secrets.token_urlsafe(24))
          PY
          )"
          printf 'PASCAL_DATA_DIR=%s\n' "$GITHUB_WORKSPACE/.pascal-data" >> "$GITHUB_ENV"
          printf 'PASCAL_ADMIN_PASSWORD=%s\n' "$EDITOR_PASSWORD" >> "$GITHUB_ENV"
          printf 'PASCAL_INSTANCE_ID=%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'PASCAL_RUNTIME_VERSION=%s\n' "$GITHUB_SHA" >> "$GITHUB_ENV"
          {
            echo '## Pascal5 runtime'
            echo
            echo 'The editor password is generated for this run and is shown again in the connection summary.'
            echo
            echo 'MCP transport: Streamable HTTP on loopback, without a bearer token.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start public Cloudflare tunnels
        shell: bash
        run: |
          set -euo pipefail
          # Start the tunnels first so Pascal receives its real public origin at boot.
          nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:3002 \
            --logfile /tmp/cloudflared-editor.log --loglevel info \
            >/tmp/cloudflared-editor-stdout.log 2>&1 &
          echo $! > /tmp/cloudflared-editor.pid

          nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8787 \
            --logfile /tmp/cloudflared-mcp.log --loglevel info \
            >/tmp/cloudflared-mcp-stdout.log 2>&1 &
          echo $! > /tmp/cloudflared-mcp.pid

          editor_url=''
          mcp_url=''
          for i in $(seq 1 60); do
            editor_url="$(grep -hEo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cloudflared-editor.log /tmp/cloudflared-editor-stdout.log 2>/dev/null | head -n 1)" || true
            mcp_url="$(grep -hEo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cloudflared-mcp.log /tmp/cloudflared-mcp-stdout.log 2>/dev/null | head -n 1)" || true
            if [ -n "$editor_url" ] && [ -n "$mcp_url" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$editor_url" ] || [ -z "$mcp_url" ]; then
            echo 'Could not obtain both Cloudflare Quick Tunnel URLs.'
            tail -n 100 /tmp/cloudflared-editor.log /tmp/cloudflared-mcp.log 2>/dev/null || true
            tail -n 100 /tmp/cloudflared-editor-stdout.log /tmp/cloudflared-mcp-stdout.log 2>/dev/null || true
            exit 1
          fi

          printf 'PASCAL_PUBLIC_URL=%s\n' "$editor_url" >> "$GITHUB_ENV"
          printf 'PASCAL_EDITOR_URL=%s\n' "$editor_url" >> "$GITHUB_ENV"
          printf 'PASCAL_MCP_URL=%s/mcp\n' "$mcp_url" >> "$GITHUB_ENV"

      - name: Start Pascal Editor and MCP
        working-directory: pascal-editor
        shell: bash
        run: |
          set -euo pipefail
          nohup env \
            PASCAL_DATA_DIR="$PASCAL_DATA_DIR" \
            PASCAL_ADMIN_PASSWORD="$PASCAL_ADMIN_PASSWORD" \
            PASCAL_PUBLIC_URL="$PASCAL_PUBLIC_URL" \
            bun dev > /tmp/pascal-editor.log 2>&1 &
          echo $! > /tmp/pascal-editor.pid

          # Official HTTP MCP transport: loopback-only, no bearer token.
          # Cloudflare reaches it locally; the public URL is /mcp.
          nohup env \
            PASCAL_DATA_DIR="$PASCAL_DATA_DIR" \
            PASCAL_INSTANCE_ID="$PASCAL_INSTANCE_ID" \
            PASCAL_RUNTIME_VERSION="$PASCAL_RUNTIME_VERSION" \
            bun packages/mcp/dist/bin/pascal-mcp.js --http --host 127.0.0.1 --port 8787 \
            > /tmp/pascal-mcp.log 2>&1 &
          echo $! > /tmp/pascal-mcp.pid

      - name: Wait for Pascal services
        shell: bash
        run: |
          set -euo pipefail
          editor_ready=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3002/api/health >/tmp/pascal-editor-health.json; then
              editor_ready=1
              break
            fi
            if ! kill -0 "$(cat /tmp/pascal-editor.pid)" 2>/dev/null; then
              echo 'Pascal Editor exited before becoming ready.'
              tail -n 120 /tmp/pascal-editor.log || true
              exit 1
            fi
            sleep 2
          done
          if [ "$editor_ready" -ne 1 ]; then
            echo 'Pascal Editor did not become ready.'
            tail -n 120 /tmp/pascal-editor.log || true
            exit 1
          fi

          mcp_ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/health >/tmp/pascal-mcp-health.json; then
              mcp_ready=1
              break
            fi
            if ! kill -0 "$(cat /tmp/pascal-mcp.pid)" 2>/dev/null; then
              echo 'Pascal MCP exited before becoming ready.'
              tail -n 120 /tmp/pascal-mcp.log || true
              exit 1
            fi
            sleep 2
          done
          if [ "$mcp_ready" -ne 1 ]; then
            echo 'Pascal MCP did not become ready.'
            tail -n 120 /tmp/pascal-mcp.log || true
            exit 1
          fi

          {
            echo '## Pascal5 connection details'
            echo
            echo "- **Editor:** ${PASCAL_EDITOR_URL}"
            echo "- **Editor password:** \`${PASCAL_ADMIN_PASSWORD}\`"
            echo "- **MCP URL:** ${PASCAL_MCP_URL}"
            echo '- **ChatGPT Authentication:** No authentication'
            echo
            echo 'The editor password protects the browser editor. The MCP endpoint itself has no bearer token.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify MCP initialize locally and through Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          payload='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"pascal5-smoke-test","version":"1.0.0"}}}'

          for target in "http://127.0.0.1:8787/mcp" "$PASCAL_MCP_URL"; do
            echo "Checking $target"
            code="$(curl --silent --show-error --output /tmp/pascal-mcp-init.out --write-out '%{http_code}' \
              --max-time 30 \
              -X POST "$target" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              --data "$payload")"
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "MCP initialize failed with HTTP $code"
              cat /tmp/pascal-mcp-init.out || true
              tail -n 100 /tmp/pascal-mcp.log || true
              exit 1
            fi
            if ! grep -q 'serverInfo' /tmp/pascal-mcp-init.out; then
              echo 'MCP returned HTTP success but no serverInfo in initialize response.'
              cat /tmp/pascal-mcp-init.out || true
              exit 1
            fi
            echo 'MCP initialize: OK'
          done

      - name: Keep Pascal running and show diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo
            echo '## Runtime diagnostics'
            echo
            echo '### Pascal Editor log (last 60 lines)'
            echo '```text'
            tail -n 60 /tmp/pascal-editor.log 2>/dev/null || true
            echo '```'
            echo
            echo '### Pascal MCP log (last 60 lines)'
            echo '```text'
            tail -n 60 /tmp/pascal-mcp.log 2>/dev/null || true
            echo '```'
            echo
            echo '### Cloudflare MCP tunnel log (last 30 lines)'
            echo '```text'
            tail -n 30 /tmp/cloudflared-mcp.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            sleep 20000
          fi
