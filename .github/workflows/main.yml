
name: Pascal Editor and MCP - Windows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pascal-editor-mcp
  cancel-in-progress: true

jobs:
  pascal:
    name: Start Pascal Editor and MCP
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ==============================================
      # 1. Checkout
      # ==============================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==============================================
      # 2. Node.js
      # ==============================================

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - name: Check environment
        shell: pwsh
        env:
          PASCAL_MCP_HTTP_TOKEN: ${{ secrets.PASCAL_MCP_HTTP_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PASCAL_MCP_HTTP_TOKEN)) {
            throw "Missing PASCAL_MCP_HTTP_TOKEN repository secret."
          }

          Write-Host "Node:"
          node --version

          Write-Host "NPM:"
          npm --version

          Write-Host "Authentication secret: configured"

      # ==============================================
      # 3. Prepare Pascal storage
      # ==============================================

      - name: Prepare Pascal directories
        shell: pwsh
        run: |
          $pascalHomePath = Join-Path $env:RUNNER_TEMP "pascal-home"
          $pascalDataPath = Join-Path $pascalHomePath "data"

          New-Item -ItemType Directory -Force -Path $pascalHomePath | Out-Null
          New-Item -ItemType Directory -Force -Path $pascalDataPath | Out-Null

          Add-Content -Path $env:GITHUB_ENV -Value "PASCAL_HOME=$pascalHomePath"
          Add-Content -Path $env:GITHUB_ENV -Value "PASCAL_DATA_DIR=$pascalDataPath"

          Write-Host "Pascal home prepared."
          Write-Host "Pascal data directory prepared."

      # ==============================================
      # 4. Install and start Pascal Editor
      # ==============================================

      - name: Start Pascal Editor
        shell: pwsh
        run: |
          $editorLog = Join-Path $env:RUNNER_TEMP "pascal-editor.log"

          Write-Host "Starting Pascal Editor..."

          $editorOutput = & npx.cmd --yes @pascal-app/cli editor --no-open --json 2>&1
          $editorExitCode = $LASTEXITCODE

          $editorOutput |
            Out-File -FilePath $editorLog -Encoding utf8

          Write-Host "Pascal Editor output:"
          Get-Content $editorLog

          if ($editorExitCode -ne 0) {
            throw "Pascal Editor failed. Exit code: $editorExitCode"
          }

          Write-Host "Pascal Editor startup command completed."

          Start-Sleep -Seconds 5

          Write-Host "Checking Pascal status..."

          $statusOutput = & npx.cmd --yes @pascal-app/cli status --json 2>&1
          $statusExitCode = $LASTEXITCODE

          $statusLog = Join-Path $env:RUNNER_TEMP "pascal-status.json"

          $statusOutput |
            Out-File -FilePath $statusLog -Encoding utf8

          Write-Host "Pascal status:"
          Get-Content $statusLog

          if ($statusExitCode -ne 0) {
            throw "Pascal CLI status check failed."
          }

          Write-Host "Pascal CLI status check completed."

      # ==============================================
      # 5. Start standalone HTTP MCP
      # ==============================================

      - name: Start Pascal MCP HTTP server
        shell: pwsh
        env:
          PASCAL_MCP_HTTP_TOKEN: ${{ secrets.PASCAL_MCP_HTTP_TOKEN }}
        run: |
          $env:PASCAL_DATA_DIR = $env:PASCAL_DATA_DIR

          $mcpLog = Join-Path $env:RUNNER_TEMP "pascal-mcp.log"
          $mcpError = Join-Path $env:RUNNER_TEMP "pascal-mcp-error.log"

          $command = "npx.cmd --yes --package=@pascal-app/mcp pascal-mcp --http --host 0.0.0.0 --port 8787"

          Write-Host "Starting Pascal MCP HTTP server..."

          $process = Start-Process `
            -FilePath $env:ComSpec `
            -ArgumentList "/d /c $command" `
            -RedirectStandardOutput $mcpLog `
            -RedirectStandardError $mcpError `
            -PassThru

          Add-Content -Path $env:GITHUB_ENV -Value "PASCAL_MCP_PID=$($process.Id)"

          Write-Host "MCP launcher PID: $($process.Id)"

          $ready = $false

          for ($i = 1; $i -le 60; $i++) {
            Start-Sleep -Seconds 2

            $process.Refresh()

            if ($process.HasExited) {
              Write-Host "MCP launcher exited."

              if (Test-Path $mcpLog) {
                Get-Content $mcpLog -Tail 100
              }

              if (Test-Path $mcpError) {
                Get-Content $mcpError -Tail 100
              }

              throw "Pascal MCP server process stopped."
            }

            $listener = Get-NetTCPConnection `
              -LocalPort 8787 `
              -State Listen `
              -ErrorAction SilentlyContinue

            if ($listener) {
              $ready = $true
              break
            }
          }

          if (-not $ready) {
            Write-Host "MCP startup log:"
            Get-Content $mcpLog -Tail 100 -ErrorAction SilentlyContinue

            Write-Host "MCP error log:"
            Get-Content $mcpError -Tail 100 -ErrorAction SilentlyContinue

            throw "MCP failed to listen on port 8787."
          }

          Write-Host "MCP TCP listener is ready."

      # ==============================================
      # 6. Verify local MCP protocol
      # ==============================================

      - name: Verify local MCP
        shell: pwsh
        env:
          PASCAL_MCP_HTTP_TOKEN: ${{ secrets.PASCAL_MCP_HTTP_TOKEN }}
        run: |
          $bodyFile = Join-Path $env:RUNNER_TEMP "mcp-request.json"
          $responseFile = Join-Path $env:RUNNER_TEMP "mcp-local-response.txt"
          $headersFile = Join-Path $env:RUNNER_TEMP "mcp-local-headers.txt"
          $curlErrorFile = Join-Path $env:RUNNER_TEMP "mcp-local-curl-error.txt"

          $payload = @{
            jsonrpc = "2.0"
            id = 1
            method = "initialize"
            params = @{
              protocolVersion = "2025-03-26"
              capabilities = @{}
              clientInfo = @{
                name = "pascal-github-actions"
                version = "1.0.0"
              }
            }
          } | ConvertTo-Json -Depth 10 -Compress

          [System.IO.File]::WriteAllText(
            $bodyFile,
            $payload,
            [System.Text.UTF8Encoding]::new($false)
          )

          $verified = $false

          for ($i = 1; $i -le 30; $i++) {
            $arguments = @(
              "--silent",
              "--show-error",
              "--connect-timeout", "8",
              "--max-time", "20",
              "--output", $responseFile,
              "--dump-header", $headersFile,
              "--stderr", $curlErrorFile,
              "--write-out", "%{http_code}",
              "-X", "POST",
              "http://127.0.0.1:8787/mcp",
              "-H", "Authorization: Bearer $env:PASCAL_MCP_HTTP_TOKEN",
              "-H", "Accept: application/json, text/event-stream",
              "-H", "Content-Type: application/json",
              "--data-binary", "@$bodyFile"
            )

            $result = & curl.exe @arguments
            $curlExit = $LASTEXITCODE
            $httpCode = ($result | Out-String).Trim()

            Write-Host "Local attempt $i: HTTP $httpCode"

            if ($curlExit -eq 0 -and $httpCode -eq "200") {
              $verified = $true
              break
            }

            Start-Sleep -Seconds 3
          }

          if (-not $verified) {
            Write-Host "Local response headers:"
            Get-Content $headersFile -ErrorAction SilentlyContinue

            Write-Host "Local response body:"
            Get-Content $responseFile -Raw -ErrorAction SilentlyContinue

            Write-Host "Curl error:"
            Get-Content $curlErrorFile -Raw -ErrorAction SilentlyContinue

            Write-Host "MCP server logs:"
            Get-Content (Join-Path $env:RUNNER_TEMP "pascal-mcp.log") -Tail 100 -ErrorAction SilentlyContinue
            Get-Content (Join-Path $env:RUNNER_TEMP "pascal-mcp-error.log") -Tail 100 -ErrorAction SilentlyContinue

            throw "Local MCP initialize failed."
          }

          Add-Content -Path $env:GITHUB_ENV -Value "PASCAL_LOCAL_VERIFY=SUCCESS"

          Write-Host "LOCAL MCP INITIALIZE: SUCCESS"
          Get-Content $responseFile -Raw

      # ==============================================
      # 7. Download Cloudflare
      # ==============================================

      - name: Download Cloudflare Tunnel
        shell: pwsh
        run: |
          $cloudflared = Join-Path $env:RUNNER_TEMP "cloudflared.exe"

          $downloadUrl = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"

          Invoke-WebRequest `
            -Uri $downloadUrl `
            -OutFile $cloudflared `
            -UseBasicParsing

          if (-not (Test-Path $cloudflared)) {
            throw "Cloudflare download failed."
          }

          & $cloudflared --version

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "CLOUDFLARED_PATH=$cloudflared"

      # ==============================================
      # 8. Start Cloudflare Quick Tunnel
      # ==============================================

      - name: Start Cloudflare Quick Tunnel
        shell: pwsh
        run: |
          $cfLog = Join-Path $env:RUNNER_TEMP "cloudflare.log"
          $cfError = Join-Path $env:RUNNER_TEMP "cloudflare-error.log"

          $process = Start-Process `
            -FilePath $env:CLOUDFLARED_PATH `
            -ArgumentList @(
              "tunnel",
              "--url",
              "http://127.0.0.1:8787",
              "--no-autoupdate",
              "--protocol",
              "http2",
              "--loglevel",
              "info"
            ) `
            -RedirectStandardOutput $cfLog `
            -RedirectStandardError $cfError `
            -PassThru

          Add-Content -Path $env:GITHUB_ENV -Value "CLOUDFLARE_PID=$($process.Id)"

          Write-Host "Cloudflare PID: $($process.Id)"

          $publicUrl = $null

          for ($i = 1; $i -le 90; $i++) {
            Start-Sleep -Seconds 2

            $process.Refresh()

            if ($process.HasExited) {
              Write-Host "Cloudflare exited."

              Get-Content $cfLog -Tail 100 -ErrorAction SilentlyContinue
              Get-Content $cfError -Tail 100 -ErrorAction SilentlyContinue

              throw "Cloudflare tunnel process stopped."
            }

            foreach ($file in @($cfLog, $cfError)) {
              if (Test-Path $file) {
                $content = Get-Content $file -Raw -ErrorAction SilentlyContinue

                if ($content -match 'https://[a-zA-Z0-9-]+\.trycloudflare\.com') {
                  $publicUrl = $Matches[0]
                  break
                }
              }
            }

            if ($publicUrl) {
              break
            }
          }

          if (-not $publicUrl) {
            Write-Host "Cloudflare output:"
            Get-Content $cfLog -Tail 100 -ErrorAction SilentlyContinue
            Get-Content $cfError -Tail 100 -ErrorAction SilentlyContinue

            throw "Cloudflare public URL not detected."
          }

          $mcpUrl = "$publicUrl/mcp"

          Add-Content -Path $env:GITHUB_ENV -Value "PASCAL_PUBLIC_URL=$publicUrl"
          Add-Content -Path $env:GITHUB_ENV -Value "PASCAL_MCP_URL=$mcpUrl"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "PASCAL PUBLIC EDITOR HOST"
          Write-Host $publicUrl
          Write-Host ""
          Write-Host "PASCAL MCP ENDPOINT"
          Write-Host $mcpUrl
          Write-Host "=========================================="

      # ==============================================
      # 9. Verify public MCP
      # ==============================================

      - name: Verify public MCP endpoint
        shell: pwsh
        env:
          PASCAL_MCP_HTTP_TOKEN: ${{ secrets.PASCAL_MCP_HTTP_TOKEN }}
        run: |
          $bodyFile = Join-Path $env:RUNNER_TEMP "mcp-request.json"
          $responseFile = Join-Path $env:RUNNER_TEMP "mcp-public-response.txt"
          $headersFile = Join-Path $env:RUNNER_TEMP "mcp-public-headers.txt"
          $curlErrorFile = Join-Path $env:RUNNER_TEMP "mcp-public-curl-error.txt"

          $payload = @{
            jsonrpc = "2.0"
            id = 2
            method = "initialize"
            params = @{
              protocolVersion = "2025-03-26"
              capabilities = @{}
              clientInfo = @{
                name = "pascal-public-test"
                version = "1.0.0"
              }
            }
          } | ConvertTo-Json -Depth 10 -Compress

          [System.IO.File]::WriteAllText(
            $bodyFile,
            $payload,
            [System.Text.UTF8Encoding]::new($false)
          )

          $verified = $false
          $lastStatus = "000"

          for ($i = 1; $i -le 25; $i++) {
            $arguments = @(
              "--silent",
              "--show-error",
              "--connect-timeout", "10",
              "--max-time", "30",
              "--output", $responseFile,
              "--dump-header", $headersFile,
              "--stderr", $curlErrorFile,
              "--write-out", "%{http_code}",
              "-X", "POST",
              $env:PASCAL_MCP_URL,
              "-H", "Authorization: Bearer $env:PASCAL_MCP_HTTP_TOKEN",
              "-H", "Accept: application/json, text/event-stream",
              "-H", "Content-Type: application/json",
              "--data-binary", "@$bodyFile"
            )

            $result = & curl.exe @arguments
            $curlExit = $LASTEXITCODE
            $httpCode = ($result | Out-String).Trim()

            $lastStatus = $httpCode

            Write-Host "Public attempt $i: HTTP $httpCode, CURL $curlExit"

            if ($curlExit -eq 0 -and $httpCode -eq "200") {
              $verified = $true
              break
            }

            Start-Sleep -Seconds 4
          }

          if ($verified) {
            Add-Content -Path $env:GITHUB_ENV -Value "PASCAL_PUBLIC_VERIFY=SUCCESS"

            Write-Host ""
            Write-Host "PUBLIC MCP INITIALIZE: SUCCESS"
            Get-Content $responseFile -Raw
          }
          else {
            Add-Content -Path $env:GITHUB_ENV -Value "PASCAL_PUBLIC_VERIFY=FAILED"

            Write-Warning "Public MCP verification failed. Diagnostic information follows."

            Write-Host "LAST HTTP STATUS:"
            Write-Host $lastStatus

            Write-Host "RESPONSE HEADERS:"
            Get-Content $headersFile -Tail 50 -ErrorAction SilentlyContinue

            Write-Host "RESPONSE BODY:"
            Get-Content $responseFile -Raw -ErrorAction SilentlyContinue

            Write-Host "CURL ERROR:"
            Get-Content $curlErrorFile -Raw -ErrorAction SilentlyContinue

            Write-Host "CLOUDFLARE STDOUT:"
            Get-Content (Join-Path $env:RUNNER_TEMP "cloudflare.log") -Tail 100 -ErrorAction SilentlyContinue

            Write-Host "CLOUDFLARE STDERR:"
            Get-Content (Join-Path $env:RUNNER_TEMP "cloudflare-error.log") -Tail 100 -ErrorAction SilentlyContinue

            Write-Warning "The job will stay alive so the diagnostic output and endpoint can be inspected."
          }

      # ==============================================
      # 10. GitHub Actions Summary
      # ==============================================

      - name: Publish connection details
        if: always()
        shell: pwsh
        run: |
          $editorUrl = $env:PASCAL_PUBLIC_URL
          $mcpUrl = $env:PASCAL_MCP_URL
          $publicStatus = $env:PASCAL_PUBLIC_VERIFY
          $localStatus = $env:PASCAL_LOCAL_VERIFY

          $summary = @"
          # Pascal Editor and MCP

          **Pascal public host**

          $editorUrl

          **MCP endpoint**

          $mcpUrl

          **Local MCP test:** $localStatus

          **Public MCP test:** $publicStatus

          **Transport:** Streamable HTTP

          **Authentication:** Bearer token

          **GitHub Secret:** `PASCAL_MCP_HTTP_TOKEN`

          Never publish the Bearer token in logs or repository files.
          "@

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "PASCAL MCP CONNECTION"
          Write-Host $mcpUrl
          Write-Host "LOCAL TEST: $localStatus"
          Write-Host "PUBLIC TEST: $publicStatus"
          Write-Host "=========================================="

      # ==============================================
      # 11. Keep services alive
      # ==============================================

      - name: Keep Pascal and Cloudflare alive
        shell: pwsh
        run: |
          Write-Host "Pascal MCP is running."
          Write-Host "Cloudflare tunnel is running."
          Write-Host "Maximum job lifetime: 6 hours."

          while ($true) {
            Start-Sleep -Seconds 30

            foreach ($processId in @(
              $env:PASCAL_MCP_PID,
              $env:CLOUDFLARE_PID
            )) {
              if ([string]::IsNullOrWhiteSpace($processId)) {
                throw "A required process ID is missing."
              }

              $process = Get-Process `
                -Id ([int]$processId) `
                -ErrorAction SilentlyContinue

              if (-not $process) {
                Write-Host "Process stopped: $processId"

                Get-Content (Join-Path $env:RUNNER_TEMP "pascal-mcp-error.log") -Tail 80 -ErrorAction SilentlyContinue
                Get-Content (Join-Path $env:RUNNER_TEMP "cloudflare-error.log") -Tail 80 -ErrorAction SilentlyContinue

                throw "A required service stopped."
              }
            }

            Write-Host "Heartbeat: $(Get-Date -Format o)"
          }
